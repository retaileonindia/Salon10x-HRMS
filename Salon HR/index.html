<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon HR — HR partner for salons</title>
<meta name="description" content="Salon HR: one platform for salon owners, managers, staff and the Salon HR team — recruitment, onboarding, attendance, payroll, compliance and exit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: one warm, expert platform for salon owners, staff and the Salon HR team
   IDEA: a salon's front desk — the website is the shopfront, each login opens the right room
   PICTURE: each part keeps its own working screen; the website hero pairs the promise with the enquiry form
   COLOUR+TYPE: lipstick berry, blush and brass throughout; Outfit headings, Inter text
   LAYOUT: website full-width bands; admin and console with a berry rail; staff app phone-first with a bottom bar */
html,body{margin:0}
[hidden]{display:none!important}
.m-site,.m-hrms,.m-console{min-height:100vh}
.m-site{color-scheme:light dark;
--bg:light-dark(#fff,#140f12);--bg2:light-dark(#fbf1f5,#1d151a);--panel:light-dark(#fff,#21181d);--ink:light-dark(#22191d,#f4ecef);--mute:light-dark(#6c5f65,#b3a5ab);
--line:light-dark(#efe4e8,#362a31);--berry:light-dark(#8a1c4a,#e8709f);--deep:#4d1029;--brass:light-dark(#9a6d0c,#e2b650);--blush:light-dark(#f9e8ef,#3a2130);--ok:light-dark(#1b7246,#62d49c)}
:root[data-theme=light] .m-site{color-scheme:light}
:root[data-theme=dark] .m-site{color-scheme:dark}
.m-site,.m-site *{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px;scroll-behavior:smooth}
.m-site{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
.m-site h1,.m-site h2,.m-site h3{font-family:Outfit,Inter,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
.m-site h1{font-size:clamp(32px,4.4vw,52px)}
.m-site h2{font-size:clamp(26px,3vw,38px)}
.m-site h3{font-size:19px}
.m-site p{margin:0}
.m-site a{color:var(--berry)}
.m-site button,.m-site input,.m-site select,.m-site textarea{font:inherit;color:inherit}
.m-site .wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
.m-site .band{padding:clamp(48px,7vw,96px) 0}
.m-site .eyebrow{color:var(--berry);font-weight:600;font-size:14px;margin-bottom:10px}
.m-site .lead{color:var(--mute);font-size:18px;max-width:640px;margin-top:12px}
.m-site header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.m-site .hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;gap:12px}
.m-site .hnav{display:flex;gap:4px;align-items:center;justify-content:center}
.m-site .mlogin{display:none!important}
.m-site .hnav>a,.m-site .hnav>div>button{background:none;border:0;color:var(--ink);text-decoration:none;font-weight:500;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:44px}
.m-site .hnav>a:hover,.m-site .hnav>div>button:hover{background:var(--bg2)}
.m-site .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 26px Outfit,sans-serif;letter-spacing:-.3px}
.m-site .logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#e8709f,#8a1c4a 55%,#4d1029);display:grid;place-items:center;color:#fff;font:700 15px Outfit;font-style:normal}
.m-site .hright{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.m-site .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);min-height:46px;white-space:nowrap}
.m-site .btn.p{background:var(--berry);border-color:var(--berry);color:light-dark(#fff,#1b0f15)}
.m-site .btn.p:hover{filter:brightness(1.08)}
.m-site .btn.g{background:var(--brass);border-color:var(--brass);color:light-dark(#fff,#1b130a)}
.m-site .btn:focus-visible,.m-site input:focus-visible,.m-site select:focus-visible,.m-site textarea:focus-visible,.m-site a:focus-visible,.m-site summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.m-site .drop{position:relative}
.m-site .dpanel{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(760px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px #4d10292b;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.m-site .dpanel[hidden]{display:none}
.m-site .dpanel a{display:flex;gap:12px;padding:12px;border-radius:12px;text-decoration:none;color:var(--ink)}
.m-site .dpanel a:hover{background:var(--bg2)}
.m-site .dpanel a span.ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--blush);color:var(--berry);display:grid;place-items:center}
.m-site .dpanel b{display:block;font-size:15px}
.m-site .dpanel small{color:var(--mute);font-size:13px;line-height:1.4;display:block}
.m-site .dpanel .all{grid-column:1/-1;justify-content:center;font-weight:600;color:var(--berry)}
.m-site .burger{display:none}
.m-site .mob{display:none}
.m-site .hero{background:radial-gradient(1200px 500px at 0% 0%,var(--blush),transparent 60%),var(--bg)}
.m-site .hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,4vw,56px);align-items:start}
.m-site .usp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.m-site .usp div{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.m-site .usp .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--berry);color:#fff;display:grid;place-items:center}
.m-site .usp b{display:block;font-size:15px}
.m-site .usp small{color:var(--mute);font-size:13.5px;line-height:1.45;display:block}
.m-site .trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.m-site .pill{border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:13px;font-weight:500;background:var(--panel)}
.m-site .form{background:var(--deep);color:#fbeef3;border-radius:22px;padding:clamp(20px,3vw,30px);box-shadow:0 30px 70px #4d102940;position:relative;overflow:hidden}
.m-site .form:before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:28px solid #ffffff10}
.m-site .form h2{font-size:26px;color:#fff}
.m-site .form p.s{opacity:.8;font-size:14px;margin:6px 0 16px}
.m-site .fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.m-site .fg .full{grid-column:1/-1}
.m-site label.f{display:block;font-size:13px;font-weight:500}
.m-site label.f>*{margin-top:5px}
.m-site .form input,.m-site .form select,.m-site .form textarea{width:100%;background:#ffffff14;border:1px solid #ffffff30;border-radius:10px;padding:10px 12px;color:#fff;font-size:16px;min-height:46px}
.m-site .form select option{color:#22191d}
.m-site .form textarea{min-height:76px}
.m-site .form input::placeholder,.m-site .form textarea::placeholder{color:#ffffff80}
.m-site .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.m-site .chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff35;border-radius:30px;padding:6px 11px;font-size:13px;cursor:pointer}
.m-site .chips input{width:auto;min-height:0;accent-color:#e2b650}
.m-site .consent{display:flex;gap:8px;font-size:12.5px;opacity:.85;margin-top:12px;align-items:flex-start}
.m-site .consent input{width:auto;min-height:0;margin-top:3px;accent-color:#e2b650}
.m-site .form .btn{width:100%;margin-top:14px}
.m-site .ok{background:#ffffff14;border-radius:14px;padding:18px}
.m-site .chg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
.m-site .chg article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:12px}
.m-site .chg .pr{color:var(--mute);font-size:15px}
.m-site .chg .so{display:flex;gap:10px;background:var(--blush);border-radius:12px;padding:12px 14px;font-size:15px}
.m-site .chg .so b{color:var(--berry)}
.m-site .num{font:600 14px Outfit;color:var(--brass)}
.m-site .life{background:var(--deep);color:#fbeef3}
.m-site .life .lead{color:#f3d9e4}
.m-site .track{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px;margin-top:38px;position:relative}
.m-site .track:before{content:"";position:absolute;left:4%;right:4%;top:27px;height:2px;background:linear-gradient(90deg,#e8709f,#e2b650)}
.m-site .track div{text-align:center;position:relative;font-size:13px;font-weight:500}
.m-site .track span{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:#2c0817;border:2px solid #e8709f;display:grid;place-items:center;color:#fff}
.m-site .crit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;margin-top:48px;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:20px;padding:clamp(20px,3vw,34px)}
.m-site .crit h3{font-size:26px;color:#fff}
.m-site .crit ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.m-site .crit li{display:flex;gap:10px}
.m-site .crit li svg{flex:none;color:#e2b650;margin-top:3px}
.m-site .exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:34px}
.m-site .exp div{border-top:3px solid var(--berry);background:var(--bg2);border-radius:0 0 16px 16px;padding:22px}
.m-site .exp h3{margin:10px 0 8px}
.m-site .exp p{color:var(--mute);font-size:15px}
.m-site .tst{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;margin-top:30px;scrollbar-width:none}
.m-site .tst::-webkit-scrollbar{display:none}
.m-site .tst figure{flex:0 0 min(360px,84%);scroll-snap-align:start;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.m-site .stars{color:var(--brass);letter-spacing:2px;font-size:18px}
.m-site .tst blockquote{margin:0;font-size:16px;flex:1}
.m-site .tst figcaption b{display:block}
.m-site .tst figcaption span{color:var(--mute);font-size:14px}
.m-site .sample{display:inline-block;background:var(--blush);color:var(--berry);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:600}
.m-site .ctrl{display:flex;gap:8px}
.m-site details.q{border-bottom:1px solid var(--line);padding:4px 0}
.m-site details.q summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font:600 18px Outfit,sans-serif}
.m-site details.q summary::-webkit-details-marker{display:none}
.m-site details.q summary:after{content:"+";color:var(--berry);font-size:24px;line-height:1}
.m-site details.q[open] summary:after{content:"–"}
.m-site details.q p{color:var(--mute);padding:0 0 18px;max-width:820px}
.m-site .cta{background:linear-gradient(120deg,var(--deep),#8a1c4a);color:#fff;border-radius:24px;padding:clamp(26px,4vw,48px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.m-site .cta h2{color:#fff}
.m-site .phero{background:var(--bg2);padding:clamp(40px,6vw,72px) 0}
.m-site .crumb{font-size:14px;color:var(--mute);margin-bottom:12px}
.m-site .crumb a{color:var(--mute)}
.m-site .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:30px}
.m-site .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.m-site .box h3{margin-bottom:12px}
.m-site .ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.m-site .ticks li{display:flex;gap:10px}
.m-site .ticks svg{flex:none;color:var(--berry);margin-top:3px}
.m-site .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.m-site .steps div{background:var(--bg2);border-radius:14px;padding:18px}
.m-site .steps b{display:block;font:600 28px Outfit;color:var(--berry)}
.m-site .sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.m-site .sgrid a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .2s}
.m-site .sgrid a:hover{border-color:var(--berry)}
.m-site .sgrid .ic{width:46px;height:46px;border-radius:12px;background:var(--blush);color:var(--berry);display:grid;place-items:center;margin-bottom:14px}
.m-site .sgrid p{color:var(--mute);font-size:15px;margin-top:6px}
.m-site .more{display:inline-flex;gap:6px;align-items:center;color:var(--berry);font-weight:600;margin-top:12px;font-size:14px}
.m-site .bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}
.m-site .bgrid a{text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.m-site .bgrid a:hover{border-color:var(--berry)}
.m-site .cover{height:120px;background:linear-gradient(130deg,var(--deep),#8a1c4a 60%,#e8709f);position:relative;color:#fff;padding:16px;display:flex;align-items:flex-end;font:600 13px Inter}
.m-site .cover:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:18px solid #ffffff18}
.m-site .bgrid .in{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.m-site .meta{color:var(--mute);font-size:13px}
.m-site .article{max-width:760px;margin:0 auto}
.m-site .article h2{font-size:24px;margin:30px 0 10px}
.m-site .article p,.m-site .article li{font-size:17px;line-height:1.75}
.m-site .article p{margin:12px 0}
.m-site .article ul,.m-site .article ol{padding-left:22px}
.m-site .article .note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mute);margin-top:26px}
.m-site .legal{max-width:820px}
.m-site .legal h2{font-size:22px;margin:26px 0 8px}
.m-site .legal p{margin:8px 0;color:var(--ink)}
.m-site .lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;max-width:980px;margin:0 auto}
.m-site .lcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}
.m-site .lcard.d{background:var(--deep);color:#fbeef3;border-color:var(--deep)}
.m-site .lcard.d h2{color:#fff}
.m-site .lcard input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;margin-top:5px}
.m-site .lcard.d input{background:#ffffff14;border-color:#ffffff30;color:#fff}
.m-site .demo{display:grid;gap:6px;margin-top:14px}
.m-site .demo button{text-align:left;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.m-site .lcard.d .demo button{border-color:#ffffff40;color:#fbeef3}
.m-site .svc-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.m-site .svc-row:last-child{border:0}
.m-site .svc-row .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--blush);color:var(--berry);display:grid;place-items:center}
.m-site .svc-row .t{flex:1}
.m-site .svc-row small{color:var(--mute);display:block;font-size:13.5px}
.m-site .tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--blush);color:var(--berry)}
.m-site .tag.on{background:light-dark(#e2f3e9,#16301f);color:var(--ok)}
.m-site .pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:24px}
.m-site .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.m-site .kp div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.m-site .kp b{display:block;font:600 24px Outfit}
.m-site .kp span{color:var(--mute);font-size:13px}
@media(max-width:860px){.m-site .lgrid,.m-site .pgrid{grid-template-columns:1fr}
.m-site .kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m-site footer{background:#24070f;color:#e9d5dd;padding:56px 0 26px;margin-top:0}
.m-site .fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr;gap:28px}
.m-site footer h4{font:600 15px Outfit;color:#fff;margin:0 0 12px}
.m-site footer a{color:#e9d5dd;text-decoration:none;font-size:14px;display:block;padding:4px 0}
.m-site footer a:hover{color:#fff}
.m-site .soc{display:flex;gap:10px;margin-top:14px}
.m-site .soc a{width:42px;height:42px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;padding:0}
.m-site .fbot{border-top:1px solid #ffffff1c;margin-top:34px;padding-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:13px;color:#cdb5bf}
.m-site .modal{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.m-site .modal[hidden]{display:none}
.m-site .sheet{background:var(--panel);border-radius:20px;padding:26px;width:min(460px,100%);position:relative}
.m-site .sheet .x{position:absolute;right:12px;top:12px}
.m-site .sheet input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;margin-top:5px}
.m-site #toast-site{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:70;pointer-events:none;max-width:90vw}
.m-site #toast-site.on{opacity:1}
@media(max-width:980px){.m-site .mob{display:inline-flex}
.m-site .hgrid,.m-site .crit,.m-site .cols{grid-template-columns:1fr}
.m-site .track{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:22px}
.m-site .track:before{display:none}
.m-site .exp,.m-site .sgrid,.m-site .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.m-site .fgrid{grid-template-columns:1fr 1fr}
.m-site .steps{grid-template-columns:1fr 1fr}}
@media(max-width:1060px){.m-site .hright .btn span{display:none}
.m-site .hright .btn{padding:10px 12px}}
@media(max-width:760px){.m-site .hbar{grid-template-columns:1fr auto}
.m-site .hnav{display:none}
.m-site .burger{display:inline-flex}
.m-site .logo{font-size:22px}
.m-site .hright .hl{display:none}
.m-site .mlogin{display:flex!important}
.m-site .hnav.open{display:flex;position:absolute;top:72px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 16px}
.m-site .hnav.open .dpanel{position:static;transform:none;width:100%;box-shadow:none;grid-template-columns:1fr;padding:4px}
.m-site .hright .btn span{display:none}
.m-site .hright .btn{padding:10px 12px}}
@media(max-width:600px){.m-site .usp,.m-site .chg,.m-site .exp,.m-site .sgrid,.m-site .bgrid,.m-site .fg,.m-site .fgrid{grid-template-columns:1fr}
.m-site .track{grid-template-columns:repeat(3,minmax(0,1fr))}
.m-site .steps{grid-template-columns:1fr}
.m-site .lead{font-size:16.5px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
.m-site #toast-site-site{transition:none}}
.m-hrms{color-scheme:light dark;
--bg:light-dark(#faf6f7,#141013);--panel:light-dark(#fff,#1e171b);--ink:light-dark(#22191d,#f4ecef);--mute:light-dark(#6e6267,#b3a5ab);
--line:light-dark(#ece3e6,#352a30);--berry:light-dark(#8a1c4a,#e8709f);--rail:#4d1029;--blush:light-dark(#f9e8ef,#3a2130);--brass:light-dark(#9a6d0c,#e2b650);

 {id:'labour-codes-salons',cat:'Compliance',date:'2026-11-18',read:6,title:'The new Labour Codes: what every salon owner in India must change',excerpt:'Four codes replaced 29 labour laws on 21 November 2025. Here is what changes for appointment letters, salary structure, overtime and gratuity in your salon.',
  body:`<p>On 21 November 2025 the Government of India brought four Labour Codes into force — the Code on Wages, the Industrial Relations Code, the Code on Social Security and the Occupational Safety, Health and Working Conditions Code. Together they replace 29 older labour laws. For salon owners, a few changes matter immediately.</p>
  <h2>1. Appointment letters are now mandatory</h2><p>Every employee — including helpers, receptionists and trainees — must receive an appointment letter with their designation, wages and terms. If your stylists joined on a handshake, issue letters now.</p>
  <h2>2. The 50% wage rule</h2><p>"Wages" now means basic pay, dearness allowance and retaining allowance. Allowances such as HRA, overtime and bonuses can be excluded only up to 50% of total remuneration; anything above that is counted as wages. In practice, keep basic pay at 50% or more of the total, because PF, gratuity and other benefits are calculated on wages.</p>
  <h2>3. Overtime is voluntary and paid at double</h2><p>Working hours are capped at 48 a week, and overtime must be voluntary and paid at twice the normal rate. Track overtime per day and approve it, rather than letting it pile up informally.</p>
  <h2>4. Gratuity for fixed-term staff after one year</h2><p>Fixed-term employees now become eligible for gratuity after one year of continuous service, instead of five. Permanent employees still need five years. Gratuity applies to establishments with 10 or more employees.</p>
  <h2>5. Social security reaches further</h2><p>ESI now applies across India rather than only in notified areas, and small establishments can join voluntarily.</p>
  <h2>What to do this month</h2><ul><li>Issue appointment letters to all staff.</li><li>Restructure salaries so basic pay is at least 50%.</li><li>Start recording daily overtime with approvals.</li><li>Review your headcount against the PF and ESI thresholds.</li></ul><p class="note">This article is general information, not legal advice. State rules can add details — speak to your HR partner for your salon's situation.</p>`},
 {id:'pf-ceiling-25000',cat:'Payroll',date:'2026-10-02',read:5,title:'EPF wage ceiling is now ₹25,000: what it means for salon payroll',excerpt:'From 17 September 2026 the EPF wage ceiling moved from ₹15,000 to ₹25,000 a month. Here is how it changes contributions for your stylists.',
  body:`<p>For the first time since 2014, the government has raised the EPF wage ceiling — from ₹15,000 to ₹25,000 a month, effective 17 September 2026. The contribution rate itself has not changed: 12% from the employee and 12% from the employer on PF wages.</p>
  <h2>Who is affected</h2><p>Employees whose PF wages are up to ₹25,000 now fall under mandatory coverage. If your salon is covered by PF, staff earning between ₹15,000 and ₹25,000 who were outside PF may now need to be enrolled, and contributions for existing members can rise to the new ceiling.</p>
  <h2>Example</h2><p>A stylist with PF wages of ₹20,000: earlier, contributions could be limited to ₹15,000, so the employee share was ₹1,800. Now 12% of ₹20,000 is ₹2,400 from the employee, and the same from the employer.</p>
  <h2>September 2026 was a split month</h2><p>Contributions for 1–16 September used the old ceiling and 17–30 September the new one, so payroll for that month needed a split calculation.</p>
  <h2>ESI did not change</h2><p>The ESI wage limit stays at ₹21,000 a month. Check PF and ESI eligibility separately.</p>
  <h2>What to do</h2><ul><li>Update your payroll ceiling to ₹25,000.</li><li>Review staff who were excluded earlier.</li><li>Explain the change to staff — take-home falls slightly, but their PF savings grow.</li></ul><p class="note">General information, not legal advice.</p>`},
 {id:'pf-esi-salons',cat:'Compliance',date:'2026-09-12',read:5,title:'PF and ESI for salons: when it is mandatory and when it is optional',excerpt:'Headcount decides most of it. A simple guide to PF and ESI for salons with 5, 12 or 25 employees.',
  body:`<p>Salon owners often ask whether they "have to" register for PF and ESI. The answer depends mainly on how many people you employ.</p>
  <h2>ESI</h2><p>ESI coverage now extends across India. It is mandatory for establishments with 10 or more employees and voluntary for smaller ones if the employer and employees agree. It covers employees earning up to ₹21,000 a month, with 0.75% from the employee and 3.25% from the employer. Staff get medical care for themselves and their families, sickness and maternity benefits.</p>
  <h2>PF</h2><p>EPF applies to establishments with 20 or more employees. Smaller salons can opt in voluntarily. Contributions are 12% each from employee and employer on PF wages up to ₹25,000 a month.</p>
  <h2>Three examples</h2><ul><li><b>5 staff:</b> neither is mandatory; both can be offered voluntarily to retain good people.</li><li><b>12 staff:</b> ESI is mandatory for eligible staff; PF is optional.</li><li><b>25 staff:</b> both PF and ESI are mandatory.</li></ul>
  <h2>Why opt in early</h2><p>Stylists increasingly compare employers on benefits. Social security costs a little but signals a professional salon, and it avoids a rush when you cross the threshold.</p><p class="note">General information, not legal advice.</p>`},
 {id:'overtime-salon-staff',cat:'Attendance',date:'2026-08-21',read:4,title:'How to handle overtime for salon staff — legally and fairly',excerpt:'Late bridal bookings and weekend rushes create overtime. Here is a simple, compliant way to manage it.',
  body:`<p>Salons rarely close on the dot. A bridal client runs late, a Saturday overflows, and staff stay back. Under the Labour Codes, overtime must be voluntary and paid at twice the normal rate of wages, and weekly hours are capped at 48.</p>
  <h2>A three-step system</h2><ol><li><b>Fix shifts.</b> Give each person a shift of 8 working hours plus a meal break, and one weekly off.</li><li><b>Record actual time.</b> Punch in, meal break and punch out every day.</li><li><b>Approve per day.</b> Time beyond the shift appears as overtime; approve it when the work was needed, decline it when it was not.</li></ol>
  <h2>Calculating the rate</h2><p>Take the ordinary hourly rate and double it. For a stylist paid ₹20,800 a month over 26 days of 8 hours, the hourly rate is ₹100, so overtime is ₹200 an hour.</p>
  <h2>Avoid these mistakes</h2><ul><li>Paying overtime in cash outside payroll.</li><li>Expecting staff to stay without pay "because it is busy".</li><li>Letting overtime run unchecked, which inflates your salary cost.</li></ul><p class="note">General information, not legal advice.</p>`},
 {id:'stop-client-poaching',cat:'Employee relations',date:'2026-07-30',read:5,title:'When stylists leave with your clients: what you can and cannot do',excerpt:'Non-compete clauses do not work in India. Confidentiality, client data rules and a clean exit do.',
  body:`<p>Every salon owner has lived this: a senior stylist resigns, and within weeks your regular clients are booking with them elsewhere.</p>
  <h2>Why non-compete clauses fail</h2><p>Under Section 27 of the Indian Contract Act, agreements that restrain someone from carrying on a trade after employment are generally void. You cannot stop a stylist from working at another salon.</p>
  <h2>What does work</h2><ul><li><b>Confidentiality from day one.</b> A signed undertaking that client names, numbers, history and preferences belong to the salon.</li><li><b>No client data on personal phones.</b> Bookings and client contact through the salon's systems only.</li><li><b>No private services while employed.</b> Exclusive service clauses are enforceable during employment.</li><li><b>Data deletion at exit.</b> Confirmed in the exit checklist.</li><li><b>Relationships owned by the salon.</b> Follow-ups and offers come from the salon, not individual staff.</li></ul>
  <h2>The best defence is retention</h2><p>Fair incentives, on-time pay and respect keep most stylists from leaving in the first place.</p><p class="note">General information, not legal advice.</p>`},
 {id:'stylist-incentives',cat:'Performance',date:'2026-06-26',read:6,title:'Designing a target-based incentive plan for stylists',excerpt:'Commission on everything rewards volume. Targets with slabs reward growth. Here is a simple plan that works.',
  body:`<p>Most salons pay stylists a fixed salary plus some form of commission. The design of that commission decides whether your team chases revenue, quality or just more chairs.</p>
  <h2>Start with a fair target</h2><p>Set a monthly service target per person based on their seniority and past three months. A common starting point is a target of four to five times their fixed pay.</p>
  <h2>Use slabs</h2><ul><li>Below 80% of target: no service incentive.</li><li>80% to 99%: half the commission rate.</li><li>100% and above: full commission rate on all service sales.</li></ul>
  <h2>Reward retail separately</h2><p>A flat percentage on product sales encourages recommendations without pushing services.</p>
  <h2>Watch the revenue-to-salary multiple</h2><p>For each person, divide their monthly revenue by their total cost. Track it month on month — it tells you who to reward and who to coach.</p>
  <h2>Keep it visible</h2><p>Staff should see their target and achievement during the month, not only on payday.</p>`},
 {id:'appointment-letter-checklist',cat:'Documentation',date:'2026-05-29',read:4,title:'Appointment letters for salon staff: a practical checklist',excerpt:'Mandatory under the Labour Codes, and your best protection as an employer. Here is what to include.',
  body:`<p>Appointment letters are now mandatory for every employee. A good letter also protects the salon.</p>
  <h2>Must-haves</h2><ul><li>Name, designation, branch and date of joining</li><li>Probation or fixed-term details</li><li>Salary breakup with basic pay at least 50% of the total</li><li>Working hours, meal break, weekly off and overtime rules</li><li>Leave entitlements and holidays</li><li>PF, ESI and other benefits that apply</li><li>Notice period for both sides</li></ul>
  <h2>Salon-specific protections</h2><ul><li>Confidentiality of client data and no private services while employed</li><li>Billing only through the salon; no direct cash collection</li><li>Return of kits, uniforms and keys</li><li>Training cost recovery for sponsored courses, on a fair pro-rata basis</li><li>Fair disciplinary process with a show-cause notice</li></ul>
  <h2>Sign it properly</h2><p>E-sign with OTP and an audit trail is accepted under the Information Technology Act, 2000 and far easier to store than paper.</p><p class="note">General information, not legal advice.</p>`},
 {id:'full-and-final-2-days',cat:'Exit',date:'2026-04-24',read:5,title:'Full and final settlement in two working days: a salon owner\'s checklist',excerpt:'The Code on Wages requires dues to be paid within two working days of the last day. Here is how to get it right.',
  body:`<p>When an employee resigns, is terminated or is retrenched, the Code on Wages requires their wages to be paid within two working days of separation. Many salons take weeks. That now carries real risk.</p>
  <h2>Before the last day</h2><ul><li>Confirm the last working day in writing.</li><li>List every item issued — kits, uniforms, ID card, keys.</li><li>Get each item returned and checked by a manager.</li><li>Hand over client notes and future appointments.</li></ul>
  <h2>The F&F calculation</h2><ul><li>Salary up to the last day, including approved overtime and incentives</li><li>Leave encashment for unused annual leave</li><li>Notice pay or notice shortfall, as per the letter</li><li>Gratuity if eligible</li><li>Statutory deductions and any lawful recoveries</li></ul>
  <h2>After payment</h2><p>Share the statement with the employee, record the payment reference, then issue the relieving letter and experience certificate.</p><p class="note">General information, not legal advice.</p>`},
 {id:'wedding-season-rosters',cat:'Attendance',date:'2026-03-27',read:4,title:'Rosters for weekends and wedding season without burning out your team',excerpt:'Plan shifts a week ahead, protect weekly offs and use approved overtime — not exhaustion.',
  body:`<p>Wedding season and weekends can double a salon's footfall. Without planning, the same few people work every rush and burn out.</p>
  <h2>Build the week on Monday</h2><p>Start from each person's default shift and fixed weekly off, then adjust for bookings you already have.</p>
  <h2>Stagger shifts</h2><p>Morning, mid and late shifts give you cover from opening to close without anyone working 12 hours.</p>
  <h2>Move weekly offs, do not cancel them</h2><p>If someone must work their usual off day, give another day off that week.</p>
  <h2>Use overtime deliberately</h2><p>Approve overtime for real peaks, and see the cost before payroll.</p>
  <h2>Publish early</h2><p>Staff who know their week in advance turn up rested and on time.</p>`},
 {id:'hiring-verifying-staff',cat:'Recruitment',date:'2026-02-20',read:5,title:'Hiring and verifying salon staff: references, trials and background checks',excerpt:'A practical hiring flow for salons — from the first call to the first day.',
  body:`<p>A wrong hire costs a salon more than salary: unhappy clients, damaged products and lost trust.</p>
  <h2>1. Screen on the phone</h2><p>Check skills, last two salons, reason for leaving, expected pay and notice period.</p>
  <h2>2. Practical trial</h2><p>Score the trial on technique, hygiene, client handling and speed, with a model or a team member.</p>
  <h2>3. Reference calls</h2><p>Call the last two workplaces. Confirm dates, role and whether they would rehire.</p>
  <h2>4. Background verification</h2><p>Take written consent, then verify identity, address and, for home-service roles, court records. Consent and limited use of data are required under the Digital Personal Data Protection Act, 2023.</p>
  <h2>5. Digital joining</h2><p>Collect documents, bank and UPI details, then issue the appointment letter for e-signature before the first shift.</p>`}

  const d={salon:g('salon'),name:g('name'),mobile:g('mobile').replace(/\D/g,''),email:g('email'),city:g('city'),state:g('state'),branches:g('branches'),staff:g('staff'),interests:[...f.querySelectorAll('[name=int]:checked')].map(x=>x.value).join(', '),msg:g('msg')};
  if(!d.salon||!d.name||!d.city)return toast('Please add salon name, your name and city');
  if(!/^[6-9]\d{9}$/.test(d.mobile.slice(-10)))return toast('Please enter a valid 10-digit mobile number');
  if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email))return toast('Please check the email address');
  if(!f.querySelector('[name=ok]').checked)return toast('Please allow us to contact you');
  try{PLATFORM.emit('lead',d)}catch(x){}
  const lines=[`Salon: ${d.salon}`,`Contact: ${d.name}`,`Mobile: ${d.mobile}`,`Email: ${d.email||'-'}`,`City/State: ${d.city}${d.state?', '+d.state:''}`,`Branches: ${d.branches}`,`Staff: ${d.staff}`,`Interested in: ${d.interests||'-'}`,`Message: ${d.msg||'-'}`];
  const subject=`New Salon HR lead: ${d.salon}, ${d.city}`;let sent=false;
  if(CONFIG.formEndpoint&&CONFIG.formKey){try{const r=await fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:CONFIG.formKey,subject,from_name:CONFIG.brand+' website',email:d.email||undefined,...d,message:lines.join('\n')})});sent=r.ok}catch(e){sent=false}}
  const mail=`mailto:${CONFIG.leadEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n'))}`;
  f.innerHTML=sent?`<div class="ok"><h2>Thank you, ${esc(d.name.split(' ')[0])}!</h2><p style="margin-top:8px">Your details have reached our partner team. We will call you on ${esc(d.mobile)} within one working day.</p></div>`
   :`<div class="ok"><h2>Almost done, ${esc(d.name.split(' ')[0])}</h2><p style="margin-top:8px">Send your details to our partner team with one tap. Your email app opens with everything filled in.</p><a class="btn g" style="width:100%;margin-top:14px" href="${mail}">Send to ${esc(CONFIG.leadEmail)}</a><p style="font-size:13px;opacity:.8;margin-top:10px">Email app didn't open? Write to ${esc(CONFIG.leadEmail)} with these details:</p><pre style="white-space:pre-wrap;font-size:12.5px;background:#00000030;border-radius:10px;padding:10px;margin-top:8px">${esc(lines.join('\n'))}</pre></div>`;
  if(!sent)try{location.href=mail}catch(e){}
}

function day(e,ds){

      o.status=o.worked>=st.fullDayMin?'P':o.worked>=st.halfDayMin?'HD':'A';

  <li><b>Remuneration.</b> Your monthly pay is set out below. Salary is paid by bank transfer on or before the 7th of the following month, with a payslip through the HRMS.${salTable(e)}</li>

  <li><b>Overtime.</b> Overtime is voluntary. Time worked beyond your shift counts as overtime only when the employer approves it for that day in the HRMS, and approved overtime is paid at twice your ordinary rate of wages. Time the employer declines is not paid as overtime, and you will not be required to stay beyond your shift.</li>
  <li><b>Leave and holidays.</b> You are entitled to ${s.leave.CL} days' casual leave and ${s.leave.SL} days' sick leave a year, annual leave of one day for every 20 days worked once you have worked 180 days in a calendar year, maternity benefit as per law, and the national and festival holidays notified each year. All leave is applied for and approved through the HRMS.</li>
  <li><b>Social security.</b> ${s.pf&&e.pf?`You will be enrolled in the Employees' Provident Fund (UAN ${esc(e.uan||'to be generated')}). `:''}${s.esi&&e.esi?`You will be covered under ESI (IP number ${esc(e.esic||'to be generated')}). `:''}Gratuity, bonus and maternity benefits apply as per the Code on Social Security, 2020 and the Code on Wages, 2019, to the extent applicable to the establishment.</li>
  <li><b>Duties and flexibility.</b> You will perform the services of your role to the salon's standards of hygiene, client safety, grooming and service quality, follow the service menu, product protocols and SOPs, and carry out other reasonable duties that match your skills. The employer may change your duties, shift, weekly off and branch for business needs, with notice as stated in this letter.</li>
  <li><b>Exclusive service.</b> While employed you will work only for the salon. You will not provide beauty, hair, makeup, nail or spa services to anyone for payment outside the salon (including home visits, freelance bookings, another salon or your own social-media booking page) without the employer's prior written permission.</li>
  <li><b>Billing, cash and tips.</b> All services and products must be billed through the salon's billing system. You will not collect cash or payments from clients directly, offer private discounts, or sell your own products to clients. Tips are handled as per the salon's tip policy.</li>
  <li><b>Products, tools and salon property.</b> Salon products, tools, equipment, uniforms, ID cards and keys are for salon work only and remain salon property. They must be returned on demand and on exit. Loss or damage caused by your proven negligence or default may be recovered only as permitted by the Code on Wages, 2019, after you have been given a chance to explain.</li>
  <li><b>Confidentiality and client data.</b> Client names, phone numbers, photos, booking history, skin and hair records, preferences, pricing, offers, formulations, vendor terms and training material are confidential. You may not copy them to personal devices or accounts, share them, contact salon clients to offer services outside the salon while employed, or use this information for yourself or anyone else after you leave. This clause continues after employment ends.</li>
  <li><b>Non-solicitation.</b> For 12 months after leaving, you will not use the salon's confidential client information to solicit its clients, and you will not persuade salon employees to leave. This does not stop you from working in the beauty industry.</li>
  <li><b>Work content and social media.</b> Photos, videos and looks created during work belong to the salon. You may post them only with the salon's tag and the client's recorded consent. You will not post anything that damages the reputation of the salon, its clients or colleagues.</li>
  <li><b>Training cost.</b> Where the salon pays for an external course or certification costing more than ₹10,000, you will sign a separate training agreement. If you resign within 12 months of finishing that training, you will repay the actual course fee on a pro-rata basis for the unserved months.</li>
  <li><b>Client complaints.</b> If a client complains about a service you performed, you will cooperate in the review and redo or correct the service within working hours where the complaint is found to be due to your error.</li>
  <li><b>Fitness and safety.</b> You will report fit for work, follow safety and hygiene rules, and inform your manager before working if you have any contagious condition that could affect clients. The salon will provide a safe workplace, first-aid facilities and required safety equipment.</li>
  <li><b>Notice period.</b> During probation either party may end employment with ${s.noticeProb} days' notice. After confirmation the notice period is ${s.noticeConf} days for either party. The employer may pay gross wages in lieu of notice or waive the notice. If you leave without serving the required notice, gross wages for the shortfall may be adjusted from your final settlement. Resignations are valid only when submitted through the HRMS.</li>
  <li><b>Unauthorised absence.</b> If you are absent for 8 or more consecutive days without approved leave or information, the employer will send a notice to your registered mobile, email and address asking you to report back. If you do not report or explain within 7 days of that notice, you will be treated as having voluntarily left employment, and your dues will be settled.</li>
  <li><b>Misconduct and discipline.</b> Theft, fraud, violence, harassment, working under the influence of alcohol or drugs, misuse of client data, private business with salon clients, falsifying attendance or billing, and repeated negligence are misconduct. The employer will issue a show-cause notice and give you a fair opportunity to be heard before deciding. Proven serious misconduct may lead to termination without notice or notice pay. You may be suspended pending inquiry, with subsistence allowance as per law.</li>
  <li><b>Liability.</b> You will be responsible for losses caused to the salon or its clients by your wilful misconduct or gross negligence, subject to applicable law.</li>
  <li><b>Lockers and inspection.</b> Lockers and bags brought into service areas may be inspected in your presence when there is reasonable cause, to protect clients and salon property.</li>
  <li><b>Verification.</b> This appointment depends on satisfactory verification of your documents and previous employment${s.bgv?', and a background check,':''}. If information you gave is found to be false or suppressed, the appointment may be withdrawn or ended after due process.</li>
  <li><b>Your rights.</b> You will receive equal pay for equal work, wages on time, a payslip every month, overtime at twice the ordinary rate when approved, leave and statutory benefits as per law, and access to the HRMS helpdesk for any grievance. Raising a grievance in good faith will never lead to adverse action.</li>
  <li><b>Prevention of sexual harassment.</b> The salon has zero tolerance for sexual harassment. Complaints can be raised confidentially through the HRMS to the Internal Committee or the Local Committee, as applicable.</li>
  <li><b>Personal data.</b> Your personal data will be processed only for employment, payroll, statutory and verification purposes under the Digital Personal Data Protection Act, 2023.</li>
  <li><b>Policies and communication.</b> The Employee Handbook in the HRMS forms part of this contract and may be updated with notice through the HRMS. Notices sent through the HRMS, to your registered email or to your registered mobile are valid communication.</li>
  <li><b>Entire agreement and severability.</b> This letter, the handbook and any training or confidentiality undertaking you sign are the full terms of employment and replace earlier discussions. If any clause is found unenforceable, the rest remains valid, and that clause applies to the maximum extent the law allows.</li>
  <li><b>Law and jurisdiction.</b> This appointment is governed by the laws of India, and the courts at ${esc(s.city)} have jurisdiction.</li></ol>
  <p>Please sign this letter in the HRMS to confirm your acceptance.</p><p>Warm regards,<br>${esc(s.owner)}, ${esc(s.ownerTitle)}</p>
  <p><b>Acceptance.</b> I have read and understood these terms and accept this appointment.</p>${sigBlock()}`}},

 nda:{title:'Confidentiality & Client Data Undertaking',signers:['employee','employer'],body:(e)=>`${LH()}<h2>CONFIDENTIALITY & CLIENT DATA UNDERTAKING</h2>
  <p>I, <b>${esc(e.name)}</b>, ${esc(e.designation)} (code ${e.code}), undertake to ${esc(S.settings.legal)} that:</p><ol>
  <li>I will treat all client information (names, contact details, photos, booking history, skin and hair records, allergies, preferences and payment details) and all business information (pricing, offers, vendor terms, formulations, training material) as confidential.</li>
  <li>I will not copy, photograph, forward or store such information on personal devices or personal social media accounts, and I will not take client photographs or videos without the client's written consent recorded by the salon.</li>
  <li>While employed, I will not offer or provide services to salon clients privately or through another business, and I will not take bookings outside the salon's system.</li>
  <li>After my employment ends, I will not use the salon's client database or confidential information to solicit its clients. I understand this does not stop me from working in the beauty industry.</li>
  <li>On exit I will return or delete all salon information in my possession and confirm this in the exit checklist.</li>
  <li>A breach of this undertaking is misconduct and may lead to disciplinary action and legal remedies available to the employer.</li></ol>${sigBlock()}`},

 handbook:{title:'Employee Handbook Acknowledgement',signers:['employee'],body:(e)=>`${LH()}<h2>EMPLOYEE HANDBOOK ACKNOWLEDGEMENT</h2>
  <p>I, <b>${esc(e.name)}</b> (code ${e.code}), confirm that I have received and read the following policies through the HRMS and agree to follow them:</p><ol>${S.policies.map(p=>`<li>${esc(p.title)}</li>`).join('')}</ol>
  <p>I understand that the policies may be updated with notice through the HRMS and that I can raise questions through the HRMS helpdesk.</p>${sigBlock()}`},

 bgv:{title:'Background Verification Consent',signers:['employee'],body:(e)=>`${LH()}<h2>CONSENT FOR VERIFICATION</h2>
  <p>I, <b>${esc(e.name)}</b>, authorise ${esc(S.settings.legal)} and its verification partner to verify my identity, address, educational qualifications and previous employment (including contacting the last two employers I have listed), and, where opted by the employer, court-record checks. I understand that:</p><ol>
  <li>My data will be used only for verification, kept securely, and shared only with the verification partner bound by confidentiality.</li><li>I may withdraw consent through the HRMS, but my appointment may then be subject to other verification acceptable to the employer.</li><li>I will be told about any adverse finding and given a chance to explain before any decision is taken.</li></ol>
  <p>This consent is given under the Digital Personal Data Protection Act, 2023.</p>${sigBlock()}`},

 confirmation:{title:'Confirmation Letter',signers:['employer','employee'],body:(e)=>`${LH()}<p>Ref: ${refNo('CNF',e)}<br>Date: ${fdate(todayS)}</p><h2>CONFIRMATION OF EMPLOYMENT</h2>
  <p>Dear ${esc(e.name)},</p><p>We are pleased to confirm your employment as <b>${esc(e.designation)}</b> with effect from ${fdate(todayS)} on successful completion of probation. All other terms of your appointment letter remain unchanged, and your notice period is now ${S.settings.noticeConf} days.</p><p>We look forward to your continued contribution.</p>${sigBlock()}`},

 warning:{title:'Warning Letter',signers:['employer','employee'],body:(e,x)=>`${LH()}<p>Ref: ${refNo('WRN',e)}<br>Date: ${fdate(todayS)}</p><h2>LETTER OF WARNING</h2>
  <p>Dear ${esc(e.name)},</p><p>This letter records the following conduct: <b>${esc(x.reason||'—')}</b>.</p><p>This is contrary to the salon's Code of Conduct. You are advised to correct this immediately. A repeat may lead to further disciplinary action after due process. You may reply to this letter through the HRMS within 3 days.</p><p>Your signature below confirms receipt, not agreement.</p>${sigBlock()}`},

 showcause:{title:'Show Cause Notice',signers:['employer','employee'],body:(e,x)=>`${LH()}<p>Ref: ${refNo('SCN',e)}<br>Date: ${fdate(todayS)}</p><h2>SHOW CAUSE NOTICE</h2>
  <p>Dear ${esc(e.name)},</p><p>It has been reported that: <b>${esc(x.reason||'—')}</b>.</p><p>If established, this would amount to misconduct under the salon's Code of Conduct and Standing Orders. You are asked to explain in writing, through the HRMS, within <b>72 hours</b> of receiving this notice, why disciplinary action should not be taken against you. You may also ask to be heard in person.</p><p>If no reply is received within this time, the matter will be decided on the facts available. ${x.suspend?'Pending the inquiry you are placed under suspension and will be paid subsistence allowance as per law.':''}</p><p>Your signature below confirms receipt.</p>${sigBlock()}`},

 termination:{title:'Termination Letter',signers:['employer','employee'],body:(e,x)=>{const mis=x.mode==='misconduct';return`${LH()}<p>Ref: ${refNo('TRM',e)}<br>Date: ${fdate(todayS)}</p><h2>LETTER OF TERMINATION</h2>
  <p>Dear ${esc(e.name)},</p>${mis?`<p>Further to the show-cause notice issued to you and after considering ${x.replied?'your reply dated '+fdate(x.replied):'the fact that no reply was received within the time allowed'}, the charge of <b>${esc(x.reason||'misconduct')}</b> has been found proved. Your employment is accordingly terminated with effect from <b>${fdate(x.lwd)}</b>.</p>`:`<p>Your employment as ${esc(e.designation)} is terminated with effect from <b>${fdate(x.lwd)}</b>, in accordance with the notice clause of your appointment letter. ${x.noticePay?'You will be paid gross wages in lieu of the notice period.':'This letter serves as notice as per your terms of employment.'}</p>`}
  <ol><li>Your full and final settlement, including wages up to your last working day${mis?'':', notice pay'}, leave encashment and other dues, will be paid within two working days of your last working day as required by the Code on Wages, 2019.</li><li>Please return all salon property and complete the exit checklist in the HRMS.</li><li>Your confidentiality obligations continue after employment ends.</li></ol>${sigBlock()}`}},

 resign_accept:{title:'Resignation Acceptance Letter',signers:['employer','employee'],body:(e,x)=>`${LH()}<p>Ref: ${refNo('RSA',e)}<br>Date: ${fdate(todayS)}</p><h2>ACCEPTANCE OF RESIGNATION</h2>
  <p>Dear ${esc(e.name)},</p><p>We acknowledge your resignation submitted through the HRMS on ${fdate(x.submittedOn)} and accept it. Your last working day will be <b>${fdate(x.lwd)}</b>.${x.waived?' The balance notice period has been waived by the employer.':''}</p>
  <p>Before your last working day please hand over your clients' service notes and appointments, return salon property, and complete the exit interview and no-dues checklist in the HRMS. Your full and final settlement will be paid within two working days of your last working day, after which your relieving and experience letters will be issued.</p><p>We thank you for your contribution and wish you the very best.</p>${sigBlock()}`},

 relieving:{title:'Relieving Letter',signers:['employer'],body:(e,x)=>`${LH()}<p>Ref: ${refNo('REL',e)}<br>Date: ${fdate(todayS)}</p><h2>RELIEVING LETTER</h2>
  <p>This is to certify that <b>${esc(e.name)}</b> (code ${e.code}) worked with ${esc(S.settings.legal)} as <b>${esc(e.designation)}</b> from ${fdate(e.doj)} to ${fdate(x.lwd||e.lwd)}, and has been relieved from duties at the close of working hours on ${fdate(x.lwd||e.lwd)}${x.type==='resignation'?' on acceptance of resignation':''}.</p>
  <p>The full and final settlement has been completed and there are no dues outstanding from either side.</p><p>We wish ${e.gender==='F'?'her':'him'} success in future endeavours.</p>${sigBlock().replace(/<div data-sig="employee">[^<]*<\/div>/,'')}`},

 experience:{title:'Experience Certificate',signers:['employer'],body:(e,x)=>`${LH()}<p>Date: ${fdate(todayS)}</p><h2>TO WHOMSOEVER IT MAY CONCERN</h2>
  <p>This is to certify that <b>${esc(e.name)}</b> was employed with ${esc(S.settings.salon)} (${esc(S.settings.legal)}) from ${fdate(e.doj)} to ${fdate(x.lwd||e.lwd)}. At the time of leaving, ${e.gender==='F'?'she':'he'} held the position of <b>${esc(e.designation)}</b> in the ${esc(e.dept)} department.</p>
  <p>During this period ${e.gender==='F'?'her':'his'} work and conduct were found to be <b>${esc(x.conduct||'good')}</b>.</p>${sigBlock().replace(/<div data-sig="employee">[^<]*<\/div>/,'')}`},

 fnf:{title:'Full & Final Settlement Statement',signers:['employer','employee'],body:(e,x)=>{const f=x.fnf||{};const L=f.lines||[];return`${LH()}<h2>FULL & FINAL SETTLEMENT</h2>
  <table><tr><td>Employee</td><td>${esc(e.name)} (${e.code})</td><td>Designation</td><td>${esc(e.designation)}</td></tr><tr><td>Date of joining</td><td>${fdate(e.doj)}</td><td>Last working day</td><td>${fdate(x.lwd)}</td></tr><tr><td>Separation type</td><td>${esc(x.type)}</td><td>Payment due by</td><td>${fdate(f.due)}</td></tr></table><br>
  <table><tr><th>Particulars</th><th>Earnings (₹)</th><th>Deductions (₹)</th></tr>${L.map(l=>`<tr><td>${esc(l[0])}</td><td style="text-align:right">${l[1]>=0?Math.round(l[1]).toLocaleString('en-IN'):''}</td><td style="text-align:right">${l[1]<0?Math.round(-l[1]).toLocaleString('en-IN'):''}</td></tr>`).join('')}
  <tr><td><b>Net amount payable</b></td><td colspan="2" style="text-align:right"><b>${inr(f.net)}</b></td></tr></table>
  <p>I confirm that I have received the above amount in full and final settlement of all my dues, and that I have no further claims against the employer, save for statutory benefits (PF/ESI/gratuity) payable through the respective authorities.</p>${sigBlock()}`}},

 exit:{title:'Exit Interview & No-Dues Form',signers:['employee','employer'],body:(e,x)=>{const ex=x.exit||{},c=x.checklist||{};return`${LH()}<h2>EXIT INTERVIEW & NO-DUES</h2>
  <table><tr><th colspan="2">Exit interview</th></tr>${(x.qs||S.settings.exitQs).map((q,i)=>`<tr><td>${esc(q)}</td><td>${esc(ex['q'+i]||'—')}</td></tr>`).join('')}
  <tr><th colspan="2">Salon property returned</th></tr>${(e.assets||[]).map(a=>`<tr><td>${esc(a.name)} × ${a.qty}</td><td>${a.status==='approved'?'Returned — approved by '+esc(a.by||''):a.status==='lost'?'Not returned — ₹'+a.value+' recoverable':'Pending'}</td></tr>`).join('')||'<tr><td colspan="2">No items issued</td></tr>'}
  <tr><th colspan="2">No-dues checklist</th></tr>${S.settings.checklist.map((k,i)=>`<tr><td>${esc(k)}</td><td>${c['c'+i]?'Cleared':'Pending'}</td></tr>`).join('')}</table>${sigBlock()}`}},
};
const EXITQ=['Main reason for leaving','What did you like most about working here?','What could the salon improve?','Were you treated fairly by your manager?','Would you recommend the salon as a workplace? (Yes/No)','Would you consider returning in future?'];
const CHECK_OLD=[['kit','Tools, kit & products returned'],['uniform','Uniform & ID card returned'],['keys','Keys / locker cleared'],['clients','Client notes & appointments handed over'],['data','Salon data deleted from personal devices'],['adv','Advances / dues settled']];

function makeDoc(type,e,x,silent){
  const t=TPL[type];let html=t.body(e,x||{});const cl=(S.settings.clauses||{})[type]||[];
  if(cl.length)html=html.replace('<div class="sigs">',`<p><b>Additional terms</b></p><ol>${cl.map(c=>`<li>${esc(c)}</li>`).join('')}</ol><div class="sigs">`);
  const d={id:uid('d'),type,title:t.title,empId:e.id,html,x:x||{},created:new Date().toISOString(),fp:hash(html),signers:t.signers.slice(),signs:{},
    status:'awaiting_'+t.signers[0],audit:[{at:new Date().toISOString(),text:'Generated by '+(silent?'system':actorName())}]};
  S.docs.unshift(d);if(!silent)audit('Generated '+t.title+' for '+e.name);return d;
}
const nextSigner=d=>d.signers.find(s=>!d.signs[s]);
function docStatus(d){if(d.status==='completed')return['Completed','c-ok'];if(d.status==='void')return['Withdrawn',''];const n=nextSigner(d);return[n==='employer'?'Awaiting employer':'Awaiting employee','c-warn']}
function docHTML(d){let h=d.html;['employer','employee'].forEach(k=>{const s=d.signs[k];if(!s)return;
  const mark=s.img?`<img alt="signature" src="${s.img}">`:`<span class="typed">${esc(s.name)}</span>`;
  h=h.replace(new RegExp(`<div data-sig="${k}">`),`<div data-sig="${k}">${mark}${esc(s.name)} · ${fdt(s.at)} · ${esc(s.method)}<br>`)});
  return h+`<p style="font-size:11px;color:#777;margin-top:18px">Document ID ${d.id} · Fingerprint ${d.fp} · Electronically signed under the Information Technology Act, 2000. Audit trail available in the HRMS.</p>`}

/* ================= POLICIES ================= */
const POLICIES=[
 {id:'conduct',title:'Code of Conduct, Grooming & Hygiene',pts:['Treat every client and colleague with courtesy; no abusive language, intoxication, theft, or sharing of tips/discounts outside salon rules.','Report on time in clean uniform with name badge; follow the salon grooming standard for hair, nails and footwear.','Sterilise tools after every client, use fresh disposables, record patch tests before colour/chemical services and follow product instructions.','Mobile phones stay in lockers on the floor except for salon work apps.','Serious misconduct (theft, fraud, violence, harassment, working under influence, misuse of client data) is handled through show-cause and inquiry and may lead to termination.']},
 {id:'attendance',title:'Attendance, Shifts & Meal Breaks',pts:['The employer assigns shifts in the HRMS; changes are notified at least 24 hours in advance.','Every employee punches in, starts and ends the meal break, and punches out in the HRMS from the salon premises (geo-fenced).','Meal break is 30 minutes; if the break is not punched, 30 minutes are still deducted, and longer breaks are deducted at actual.','Grace of '+15+' minutes on arrival; every 3 late marks in a month count as half a day of unpaid leave.','A day with at least 7 hours worked is a full day, 4 to 7 hours is a half day, and under 4 hours is absent. A missed punch must be regularised by the employer with a reason before payroll.']},
 {id:'ot',title:'Overtime',pts:['Overtime is voluntary and counts only when the employer approves it in the HRMS for that specific day.','Time beyond the shift is counted in blocks of 30 minutes; work on a weekly off or holiday is counted fully as overtime subject to approval.','Approved overtime is paid at twice the ordinary rate of wages in the same month\'s payroll.','Denied overtime is not paid; employees are never required to stay beyond shift hours without consent.','Total working hours, including overtime, are kept within the limits set by the applicable state rules.']},
 {id:'leave',title:'Leave & Holidays',pts:['Casual leave: '+7+' days a year; sick leave: '+7+' days a year (medical certificate for more than 2 consecutive days).','Annual (earned) leave: 1 day for every 20 days worked, once 180 days are worked in a calendar year; may be carried forward up to 30 days and is encashed on exit.','Half-day leave can be applied for any leave type; leave without pay applies when balances are exhausted.','All leave is applied for and approved in the HRMS; unapproved absence is treated as unpaid.','National and festival holidays are notified at the start of each year; work on a holiday is paid as overtime or given a substitute holiday.','Maternity benefit of 26 weeks and other statutory leave are provided as per law.']},
 {id:'pay',title:'Payroll, Incentives & Deductions',pts:['Salary is paid by bank transfer on or before the 7th of the following month, with a payslip in the HRMS.','Basic wages are at least 50% of total remuneration as required by the Code on Wages, 2019.','Payroll is generated only after the employer has approved all overtime, regularised missed punches, decided leave, and entered the month\'s target achievement.','Incentive: full commission on service sales when 100% of the monthly target is achieved, half commission between 80% and 99.9%, none below 80%; product commission as per the appointment letter.','Only deductions allowed by law are made (PF, ESI, professional tax, TDS, approved advances); total deductions never exceed 50% of wages.']},
 {id:'statutory',title:'PF, ESI, Gratuity & Bonus',pts:['PF: 12% employee and 12% employer contribution on PF wages up to the ceiling of ₹25,000 a month, mandatory for establishments with 20 or more employees and voluntary for smaller salons that opt in.','ESI: 0.75% employee and 3.25% employer contribution for employees with gross wages up to ₹21,000 a month; mandatory for establishments with 10 or more employees.','Gratuity for establishments with 10 or more employees: after 5 years of continuous service, or pro-rata after 1 year for fixed-term employees.','Statutory bonus as per the Code on Wages, 2019 for eligible employees who have worked at least 30 days in the year.']},
 {id:'posh',title:'Prevention of Sexual Harassment (POSH)',pts:['Zero tolerance for sexual harassment of employees or clients by anyone.','Salons with 10 or more employees constitute an Internal Committee; smaller salons refer complaints to the Local Committee of the district.','Complaints can be raised confidentially through the HRMS (POSH category is visible only to the committee and owner).','Complaints are inquired into within 90 days; retaliation against a complainant or witness is misconduct.']},
 {id:'data',title:'Client Data, Photos & Social Media',pts:['Client information is confidential and stays in salon systems only.','No client photos or videos without written consent recorded by the salon; no posting salon clients on personal accounts.','Employees may not solicit salon clients for private services while employed or use the salon\'s client database after leaving.','Employee personal data is processed only for employment purposes under the DPDP Act, 2023, and employees can view and correct it in the HRMS.']},
 {id:'grievance',title:'Grievance Redressal & Escalation',pts:['Every query or complaint (pay, attendance, leave, OT, behaviour) is raised as a ticket in the HRMS helpdesk.','The employer responds within 48 hours; the employee can escalate an unresolved ticket, which is marked high priority for the owner.','Salons with 20 or more employees constitute a Grievance Redressal Committee as required by the Industrial Relations Code, 2020.','Raising a grievance in good faith will never lead to adverse action.']},
 {id:'discipline',title:'Disciplinary Procedure',pts:['Minor lapses: verbal counselling, then a written warning through the HRMS.','Serious allegations: show-cause notice through the HRMS with 72 hours to reply and an opportunity to be heard.','Decision recorded in writing with reasons: warning, suspension with subsistence allowance, or termination.','All notices, replies and decisions are stored in the HRMS with signatures and timestamps.']},
 {id:'separation',title:'Resignation, Termination & Exit',pts:['Resignations are submitted in the HRMS; notice is '+7+' days during probation and '+30+' days after confirmation, either side.','The employer accepts the resignation and confirms the last working day; notice may be waived or bought out.','On exit: return of kit/uniform/keys, client handover, data deletion, exit interview and no-dues are completed in the HRMS.','Full and final settlement is paid within two working days of the last working day (Code on Wages, 2019), followed by relieving and experience letters.','After exit you can view and save your payslips, F&F and letters in the staff app for 3 months. Your personal details are then deleted; only records the law requires (wage, attendance and leave registers, F&F and signed letters) are kept for 5 years and then deleted.']},
 {id:'verification',title:'Joining, Verification & BGV',pts:['New employees complete the joining form in the HRMS with identity, address, bank, education and last two employers.','The employer verifies documents and calls the two previous employers; outcomes are recorded in the HRMS.','Where the salon opts for background verification, the employee\'s written consent is taken first.','Aadhaar and bank numbers are stored masked; original documents are only viewed, never retained in physical form.','Optionally, employees can keep a Salon HR Verified Work History (salons, roles, dates and verification results). It is shared with a new employer only with the employee\'s approval and can be withdrawn at any time.']},
];

const chip=(t,c)=>`<span class="chip ${c||''}">${esc(t)}</span>`;

VIEWS.dashboard=()=>{
  const c=counts(),act=SE().filter(e=>['active','onboarding','notice'].includes(e.status));
  const today=act.map(e=>({e,o:day(e,todayS)}));
  const present=today.filter(x=>x.r||x.o.r.in).length,onLeave=today.filter(x=>x.o.leave).length;
  const head_=act.length;
  const alerts=[];
  const soon=SE().filter(e=>e.status==='exited'&&!e.archived&&daysLeft(purgeOn(e))<=14);if(soon.length)alerts.push(['warn',`Personal details of ${soon.map(e=>e.name).join(', ')} will be deleted within 14 days (${S.settings.keepMonths}-month retention after exit). Save anything you need from Past employees.`]);
  if(!isBoss())alerts.length=0;
  if(head_>=20&&!S.settings.pf)alerts.push(['bad','PF is mandatory at 20+ employees. Turn on the PF service.']);
  if(head_>=10&&!S.settings.esi)alerts.push(['bad','ESI is mandatory at 10+ employees. Turn on the ESI service.']);
  if(head_>=10)alerts.push(['warn','10+ employees: constitute a POSH Internal Committee and record it in Settings.']);
  if(!S.settings.minWage)alerts.push(['info','Enter your zone\'s minimum wage in Settings to enable minimum-wage checks on every payslip.']);
  const unsigned=SE().filter(e=>e.status!=='exited'&&!S.docs.some(d=>d.empId===e.id&&d.type==='appointment'&&d.status==='completed'));
  if(unsigned.length)alerts.push(['warn',`Appointment letter not fully signed: ${unsigned.map(e=>e.name).join(', ')}. Appointment letters are mandatory under the Labour Codes.`]);
  S.seps.filter(s=>inScope(E(s.empId))&&s.fnf&&!s.fnf.paid&&s.status!=='closed').forEach(s=>alerts.push(['warn',`F&F for ${E(s.empId).name} due by ${fdate(s.fnf.due)} (2 working days rule).`]));
  const prev=mkShift(curMK,-1);
  const todo=[['attendance','ot','Overtime awaiting your approval',c.ot],['attendance','mp','Missed punches to regularise',c.mp],['leave','','Leave requests',c.lv],['documents','','Documents waiting for your signature',c.docs],['separations','','Resignations / exits in progress',c.seps],['helpdesk','','Open helpdesk tickets',c.tk],['employees','','New joiners in onboarding',c.onb],['employees','','Profile change requests',c.cr],['separations','','Returned items to approve (exits)',c.ret]].filter(x=>x[3]);
  return head(`Good ${NOW.getHours()<12?'morning':NOW.getHours()<17?'afternoon':'evening'}, ${(user()?user().name:S.settings.owner).split(' ')[0]}`,fdate(todayS)+' · '+esc(S.settings.salon))+
  `<div class="grid g4" style="margin-bottom:16px"><div class="kpi"><b>${head_}</b><span>Staff on roll</span></div><div class="kpi"><b>${today.filter(x=>x.o.r.in).length}</b><span>Punched in today</span></div><div class="kpi"><b>${onLeave}</b><span>On leave today</span></div><div class="kpi"><b>${S.payroll[prev]?'Released':'Pending'}</b><span>${mname(prev)} payroll</span></div></div>
  <div class="grid g2"><div class="card"><h2>Needs your action</h2>${todo.length?`<div class="list">${todo.map(t=>`<div><span class="dot" style="background:var(--berry)"></span><span class="sp">${t[2]}</span><b>${t[3]}</b><button class="btn s" data-act="go" data-v="${t[0]}" data-t="${t[1]}">Open</button></div>`).join('')}</div>`:'<div class="empty">All clear. Nothing is waiting for you.</div>'}</div>
  <div class="card"><h2>On the floor today</h2><div class="list">${today.map(({e,o})=>{const r=o.r;const s=r.out?'Left '+r.out:r.mealOut&&!r.mealIn?'On meal break':r.in?'In since '+r.in:o.leave?'On leave':o.status==='WO'?'Weekly off':'Not in yet';
    return`<div><span class="dot" style="background:${r.in&&!r.out?'var(--ok)':o.leave||o.status==='WO'?'var(--info)':'var(--mute)'}"></span><span class="sp"><b>${esc(e.name)}</b><br><span class="small muted">${esc(bn(e))} · ${esc(o.sh.name)} ${o.sh.start}–${o.sh.end}</span></span><span class="small">${s}${o.late?' · '+chip('Late '+o.late+'m','c-warn'):''}</span></div>`}).join('')}</div></div></div>
  <div class="card"><h2>Compliance watch</h2>${alerts.length?`<div class="list">${alerts.map(a=>`<div>${chip(a[0]==='bad'?'Action':a[0]==='warn'?'Check':'Tip','c-'+a[0])}<span class="sp small">${esc(a[1])}</span></div>`).join('')}</div>`:'<div class="empty">No compliance gaps found.</div>'}</div>
  <div class="card"><h2>Recent activity</h2><div class="list">${S.audit.slice(0,8).map(a=>`<div><span class="small muted" style="width:150px">${fdt(a.at)}</span><span class="sp small">${esc(a.text)}</span><span class="small muted">${esc(a.by)}</span></div>`).join('')||'<div class="empty">Actions taken in the HRMS appear here.</div>'}</div></div>`;
};

  return head('Attendance & overtime','Punches come from the employee app. You approve overtime and fix missed punches; payroll stays locked until both are done.')+tb+`<div class="card">${body}</div>`;
};
function otCell(e,o){if(!o.ot)return'<span class="muted small">—</span>';const d=o.otDecision;

  return`${chip(hm(o.ot)+' '+(d==='approved'?'approved':'denied'),d==='approved'?'c-ok':'c-bad')} ${S.payroll[o.ds.slice(0,7)]?'':`<button class="btn s" data-act="ot" data-id="${e.id}" data-d="${o.ds}" data-v="pending" title="Undo">Undo</button>`}`}
ACT.ot=el=>{const r=rec(el.dataset.id,el.dataset.d);if(el.dataset.v==='pending')delete r.otDecision;else{r.otDecision=el.dataset.v;r.otBy=S.settings.owner;r.otAt=new Date().toISOString()}

ACT.regEdit=el=>{const e=E(el.dataset.id),ds=el.dataset.d,r=rec(e.id,ds)||{};if(S.payroll[ds.slice(0,7)])return toast('That month\'s payroll is finalised. Reopen it first.');
  openModal(`<h2>Edit attendance</h2><p class="sub">${esc(e.name)} · ${fdate(ds)} · shift ${shiftFor(e,ds).start}–${shiftFor(e,ds).end}</p><form id="fr"><div class="fg"><label class="f">Punch in<input type="time" name="in" value="${r.in||''}"></label><label class="f">Meal start<input type="time" name="mo" value="${r.mealOut||''}"></label><label class="f">Meal end<input type="time" name="mi" value="${r.mealIn||''}"></label><label class="f">Punch out<input type="time" name="out" value="${r.out||''}"></label></div>
  <label class="f" style="margin-top:12px">Reason (required, visible to employee)<input name="why" required placeholder="Forgot to punch out; confirmed with CCTV"></label><div class="row" style="margin-top:14px"><button type="button" class="btn bad" data-act="regClear" data-id="${e.id}" data-d="${ds}">Mark absent (clear punches)</button><span class="sp"></span><button class="btn p">Save</button></div></form>`,()=>{
  $('#fr').onsubmit=ev=>{ev.preventDefault();const f=$('#fr');const why=fval(f,'why');if(!why)return toast('Add a reason');
    const n={in:fval(f,'in')||null,mealOut:fval(f,'mo')||null,mealIn:fval(f,'mi')||null,out:fval(f,'out')||null,reg:{by:S.settings.owner,why,at:new Date().toISOString()},src:'Regularised by owner'};
    if(!n.in)return toast('Punch in time needed');setRec(e.id,ds,n);audit(`Regularised ${e.name} on ${fdate(ds)}: ${why}`);closeModal();render();toast('Attendance updated')}})};
