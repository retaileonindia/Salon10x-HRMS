VIEWS.leave=()=>{const ins=l=>{const e=E(l.empId);return!!e&&e.status!=='exited'&&inScope(e)};const pend=S.leaves.filter(l=>l.status==='pending'&&ins(l)),hist=S.leaves.filter(l=>l.status!=='pending'&&ins(l)).sort((a,b)=>a.from<b.from?1:-1).slice(0,30);
  const lrow=(l,act)=>{const e=E(l.empId);return`<tr><td><b>${esc(e.name)}</b><br><span class="small muted">${esc(bn(e))}</span></td><td>${chip(lname(l.type),lpaid(l.type)?'c-info':'c-bad')}${l.half?' '+chip('Half day'):''}</td><td>${fdate(l.from)}${l.to!==l.from?' – '+fdate(l.to):''}</td><td class="small">${esc(l.reason)}${act&&lpaid(l.type)?`<br><span class="muted">Balance ${e.lb[l.type]??0} · needs ${lvDays(l)}</span>`:''}</td><td>${act?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn s ok" data-act="lv" data-id="${l.id}" data-v="approved">Approve</button><button class="btn s bad" data-act="lv" data-id="${l.id}" data-v="rejected">Reject</button></span>`:chip(l.status,l.status==='approved'?'c-ok':'c-bad')}</td></tr>`};
  return head('Leave','Approve requests; balances update automatically. Leave types and quotas are set by the owner in Customise.',isBoss()?`<button class="btn" data-act="go" data-v="customise" data-t="leave">Edit leave types</button>`:'')+
  `<div class="card"><h2>Requests (${pend.length})</h2>${pend.length?`<table class="stack"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Reason</th><th></th></tr></thead><tbody>${pend.map(l=>lrow(l,1)).join('')}</tbody></table>`:'<div class="empty">No pending requests.</div>'}</div>
  <div class="card"><h2>Balances</h2><p class="sub" style="margin-bottom:8px">Edit any number directly.</p><div class="scroll"><table class="stack"><thead><tr><th>Employee</th>${LT().map(t=>`<th class="n">${esc(t.name)}</th>`).join('')}</tr></thead><tbody>${SE().filter(e=>e.status!=='exited').map(e=>`<tr><td>${esc(e.name)}</td>${LT().map(t=>`<td class="n"><input type="number" step="0.5" min="0" value="${e.lb[t.code]??0}" data-change="lbSet" data-id="${e.id}" data-k="${t.code}" style="width:80px;padding:5px;min-height:32px;text-align:right"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h2>History</h2><table class="stack"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th></tr></thead><tbody>${hist.map(l=>lrow(l,0)).join('')}</tbody></table></div>`};
const lvDays=l=>l.half?0.5:Math.round((new Date(l.to)-new Date(l.from))/864e5)+1;
ACT.lv=el=>{const l=S.leaves.find(x=>x.id===el.dataset.id),e=E(l.empId);l.status=el.dataset.v;l.decidedOn=todayS;l.by=actorName();
  if(l.status==='approved'&&lpaid(l.type)){const n=lvDays(l);if((e.lb[l.type]??0)<n){l.type='LOP';toast('Balance insufficient — approved as leave without pay')}else e.lb[l.type]-=n}
  audit(`Leave ${l.status} for ${e.name} (${fdate(l.from)})`);render()};

/* ================= OWNER: PAYROLL ================= */
VIEWS.payroll=()=>{const mk=S.ui.mk,pr=S.payroll[mk];let body='';
  if(pr&&pr.status==='finalized'){const rows=pr.rows;const tot=k=>rows.reduce((a,r)=>a+r[k],0);
    body=`<div class="note i" style="margin-bottom:14px">Finalised by ${esc(pr.by)} on ${fdt(pr.at)}. Payslips are visible to employees. To change anything, reopen with a reason.</div>
    <div class="grid g4" style="margin-bottom:14px"><div class="kpi"><b>${inr(tot('gross'))}</b><span>Gross earnings</span></div><div class="kpi"><b>${inr(tot('net'))}</b><span>Net to bank</span></div><div class="kpi"><b>${inr(tot('pfEE')+tot('pfER')+tot('adm')+tot('edli'))}</b><span>PF remittance</span></div><div class="kpi"><b>${inr(tot('esiEE')+tot('esiER'))}</b><span>ESI remittance</span></div></div>
    ${register(rows,false)}<div class="row" style="margin-top:14px"><button class="btn" data-act="bankFile">Bank transfer file</button>${S.settings.pf?'<button class="btn" data-act="ecr">EPF ECR file</button>':''}${S.settings.esi?'<button class="btn" data-act="esicFile">ESIC contribution file</button>':''}<span class="sp"></span><button class="btn bad" data-act="reopen">Reopen payroll</button></div>`}
  else{const c=payChecks(mk);const rows=c.emps.map(e=>payCalc(e,mk));const proj=mk===curMK;
    const ck=(ok,t,n,go,tab)=>`<div class="check"><span class="ic" style="background:${ok?'var(--okb)':'var(--badb)'};color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':n}</span><div class="sp"><b>${t}</b>${ok?'':`<div class="small muted">${n} item(s) pending</div>`}</div>${ok?'':`<button class="btn s" data-act="go" data-v="${go}" data-t="${tab||''}">Resolve</button>`}</div>`;
    body=`<div class="grid g2"><div class="card" style="margin:0"><h2>Before you can generate payroll</h2>
      ${ck(!c.ot.length,'Every overtime entry approved or denied',c.ot.length,'attendance','ot')}${ck(!c.mp.length,'Missed punches regularised',c.mp.length,'attendance','mp')}${ck(!c.lv.length,'Leave requests decided',c.lv.length,'leave')}${ck(!c.perf.length,'Target achievement entered and marked final',c.perf.length,'performance')}
      ${proj?`<div class="note" style="margin-top:10px">${mname(mk)} is still running: ${daysIn(mk)-NOW.getDate()} future day(s) are counted as scheduled. Best to finalise after the month ends.</div>`:''}
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="confirmPay"> I have reviewed attendance, OT, leave, incentives and deductions for ${mname(mk)}.</label>
      <button class="btn p" style="margin-top:12px;width:100%" data-act="finalize" ${c.ok?'':'disabled'}>Generate payroll & release payslips</button></div>
      <div class="card" style="margin:0"><h2>Draft totals</h2><div class="list"><div><span class="sp">Employees</span><b>${rows.length}</b></div><div><span class="sp">Gross earnings</span><b>${inr(rows.reduce((a,r)=>a+r.gross,0))}</b></div><div><span class="sp">Approved OT pay</span><b>${inr(rows.reduce((a,r)=>a+r.otPay,0))}</b></div><div><span class="sp">Incentives</span><b>${inr(rows.reduce((a,r)=>a+r.inc+r.pinc,0))}</b></div><div><span class="sp">Net payable</span><b>${inr(rows.reduce((a,r)=>a+r.net,0))}</b></div><div><span class="sp">Employer cost (incl. PF/ESI)</span><b>${inr(rows.reduce((a,r)=>a+r.cost,0))}</b></div></div></div></div>
      <h2 style="margin:18px 0 8px">Draft register</h2><p class="sub" style="margin-bottom:8px">Edit advances, other deductions and TDS here. Everything else comes from attendance, OT decisions and targets.</p>${register(rows,true)}`}
  return head('Payroll',`Salary for a month is generated only after you finish all approvals for that month.`,monthSel())+`<div class="card">${body}</div>`};
function register(rows,edit){const mk=S.ui.mk;return`<div class="scroll"><table class="stack"><thead><tr><th>Employee</th><th class="n">Paid days</th><th class="n">Fixed earned</th><th class="n">OT pay</th><th class="n">Incentive</th><th class="n">Gross</th><th class="n">PF</th><th class="n">ESI</th><th class="n">PT</th><th class="n">Advance / other / TDS</th><th class="n">Net pay</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.warn.length?'<br>'+chip(r.warn[0],'c-bad'):''}</td><td class="n">${r.paidDays}/${r.days}${r.latePen?`<br><span class="small muted">−${r.latePen} late</span>`:''}</td><td class="n">${inr(r.basic+r.hra+r.spl)}</td><td class="n">${inr(r.otPay)}<br><span class="small muted">${hm(r.otMin)}</span></td><td class="n">${inr(r.inc+r.pinc)}</td><td class="n b">${inr(r.gross)}</td><td class="n">${inr(r.pfEE)}</td><td class="n">${inr(r.esiEE)}</td><td class="n">${inr(r.pt)}</td>
  <td class="n">${edit?`<span class="row" style="gap:4px;flex-wrap:nowrap;justify-content:flex-end">${['adv','oth','tds'].map(k=>`<input aria-label="${k}" type="number" min="0" value="${r[k]||''}" placeholder="${k==='adv'?'Adv':k==='oth'?'Other':'TDS'}" data-change="adj" data-id="${r.empId}" data-k="${k}" style="width:76px;padding:5px;min-height:32px;font-size:14px">`).join('')}</span>`:inr(r.adv+r.oth+r.tds)}</td><td class="n b">${inr(r.net)}</td><td><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn s" data-act="slip" data-id="${r.empId}" data-m="${mk}">Payslip</button>${edit?'':(((S.pays[mk]||{})[r.empId])?chip('Paid '+S.pays[mk][r.empId].mode,'c-ok'):`<button class="btn s p" data-act="payOne" data-id="${r.empId}">Pay</button>`)}</span></td></tr>`).join('')}</tbody></table></div>`}
CH.adj=el=>{const mk=S.ui.mk;((S.adj[mk]=S.adj[mk]||{})[el.dataset.id]=S.adj[mk][el.dataset.id]||{})[el.dataset.k]=+el.value||0;render()};

  return`<div class="doc">${LH()}<h2>PAYSLIP — ${mname(mk).toUpperCase()}</h2><table><tr><td>Name</td><td>${esc(e.name)}</td><td>Employee code</td><td>${e.code}</td></tr><tr><td>Designation</td><td>${esc(e.designation)}</td><td>Date of joining</td><td>${fdate(e.doj)}</td></tr><tr><td>UAN</td><td>${esc(s.pf&&e.pf?e.uan:'Not applicable')}</td><td>ESIC IP no.</td><td>${esc(s.esi&&e.esi?e.esic:'Not applicable')}</td></tr><tr><td>Bank a/c</td><td>${esc(mask((e.onb.data||{}).acct))}</td><td>Days paid</td><td>${r.paidDays} of ${r.days} (LOP ${r.lop})</td></tr></table><br>

  <tr><td><b>Gross earnings</b></td><td style="text-align:right"><b>${r.gross.toLocaleString('en-IN')}</b></td><td><b>Total deductions</b></td><td style="text-align:right"><b>${r.ded.toLocaleString('en-IN')}</b></td></tr><tr><td colspan="3"><b>Net pay credited</b></td><td style="text-align:right"><b>${inr(r.net)}</b></td></tr></table>
  <p style="font-size:12px">Employer contributions (not deducted from you): PF ${inr(r.pfER)}, PF admin & EDLI ${inr(r.adm+r.edli)}, ESI ${inr(r.esiER)}. Target ${inr(r.target)} · achieved ${inr(r.svc)} · retail ${inr(r.prod)}. Late marks ${r.lates}${r.latePen?' ('+r.latePen+' day LOP)':''}.</p><p style="font-size:11px;color:#777">Computer-generated payslip; no signature required. Wages paid under the Code on Wages, 2019.</p></div>`}

VIEWS.performance=()=>{const mk=S.ui.mk,open=!S.payroll[mk],emps=SE().filter(e=>inMonth(e,mk));
  const months=[];for(let k=-4;k<=0;k++)months.push(mkShift(curMK,k));
  const sel=(S.ui.tab.perfEmp&&SE().some(e=>e.id===S.ui.tab.perfEmp&&e.status!=='exited'))?S.ui.tab.perfEmp:SE().find(e=>e.target&&e.status!=='exited')?.id;const se=E(sel);
  const series=se?months.map(m=>{const p=(S.perf[se.id]||{})[m]||{};const pr=S.payroll[m];const r=pr?pr.rows.find(x=>x.empId===se.id):null;return{m,t:p.target||0,a:p.service||0,prod:p.product||0,cost:r?r.cost:(inMonth(se,m)?payCalc(se,m).cost:0),fin:!!pr}}):[];
  return head('Productivity','Monthly target vs achievement against what each person costs. Feeds incentives in payroll.',monthSel())+
  `<div class="card"><h2>${mname(mk)} — targets & achievement</h2><p class="sub" style="margin-bottom:10px">${open?'Enter sales from your billing software (or the live POS integration) and tick Final once the month is closed. Payroll needs every row final.':'Payroll finalised — figures locked.'}</p>
  <div class="scroll"><table class="stack"><thead><tr><th>Employee</th><th class="n">Target</th><th class="n">Service sales</th><th class="n">Retail sales</th><th>Achievement</th><th class="n">Salary cost</th><th class="n">Revenue ÷ cost</th><th>Final</th></tr></thead><tbody>${emps.map(e=>{const p=(S.perf[e.id]=S.perf[e.id]||{})[mk]||{target:e.target,service:0,product:0};const pr=S.payroll[mk];const r=pr?pr.rows.find(x=>x.empId===e.id):payCalc(e,mk);const a=p.target?p.service/p.target:0;
    const inp=(k)=>open?`<input type="number" min="0" value="${p[k]||0}" data-change="perf" data-id="${e.id}" data-k="${k}" style="width:110px;padding:5px;min-height:34px">`:inr(p[k]);
    return`<tr><td><b>${esc(e.name)}</b><br><span class="small muted">${esc(e.designation)}</span></td><td class="n">${inp('target')}</td><td class="n">${inp('service')}</td><td class="n">${inp('product')}</td><td style="min-width:140px">${p.target?`<div class="bars"><div class="t" style="height:10px"><i style="width:${Math.min(100,a*100)}%;background:${a>=1?'var(--ok)':a>=.8?'var(--brass)':'var(--bad)'}"></i></div></div><span class="small">${Math.round(a*100)}%</span>`:'<span class="small muted">No target</span>'}</td><td class="n">${inr(r.cost)}</td><td class="n b">${r.cost?((p.service+p.product)/r.cost).toFixed(1)+'×':'—'}</td><td>${open?`<input type="checkbox" ${p.final?'checked':''} data-change="perfFinal" data-id="${e.id}" style="width:22px;min-height:22px">`:'✓'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><div class="row"><h2 class="sp">Month on month</h2><select data-change="perfEmp" style="width:auto">${SE().filter(e=>e.target&&e.status!=='exited').map(e=>`<option value="${e.id}"${e.id===sel?' selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
  ${se?`<div class="fig" id="mom" data-s='${esc(JSON.stringify(series))}'><svg></svg></div><div class="row small muted" style="gap:16px;margin-top:6px"><span><span class="dot" style="display:inline-block;background:var(--line);border:1px solid var(--mute)"></span> Target</span><span><span class="dot" style="display:inline-block;background:var(--berry)"></span> Service sales</span><span><span class="dot" style="display:inline-block;background:var(--brass)"></span> Salary cost</span></div>
  <table class="stack" style="margin-top:10px"><thead><tr><th>Month</th><th class="n">Target</th><th class="n">Achieved</th><th class="n">%</th><th class="n">Salary cost</th><th class="n">Revenue ÷ cost</th></tr></thead><tbody>${series.filter(x=>x.t||x.a).map(x=>`<tr><td>${mname(x.m)}${x.fin?'':' (open)'}</td><td class="n">${inr(x.t)}</td><td class="n">${inr(x.a)}</td><td class="n">${x.t?Math.round(x.a/x.t*100):0}%</td><td class="n">${inr(x.cost)}</td><td class="n b">${x.cost?((x.a+x.prod)/x.cost).toFixed(1)+'×':'—'}</td></tr>`).join('')}</tbody></table>`:''}</div>`};
CH.perf=el=>{const mk=S.ui.mk,e=E(el.dataset.id);const p=(S.perf[e.id]=S.perf[e.id]||{})[mk]=S.perf[e.id][mk]||{target:e.target,service:0,product:0};p[el.dataset.k]=+el.value||0;render()};
CH.perfFinal=el=>{const mk=S.ui.mk,e=E(el.dataset.id);const p=(S.perf[e.id]=S.perf[e.id]||{})[mk]=S.perf[e.id][mk]||{target:e.target,service:0,product:0};p.final=el.checked;render()};
CH.perfEmp=el=>{S.ui.tab.perfEmp=el.value;render()};
function drawMom(){const f=$('#mom');if(!f)return;const svg=f.querySelector('svg');const data=JSON.parse(f.dataset.s);
  const draw=()=>{const W=f.clientWidth,H=f.clientHeight;if(W<120||H<80)return;const pl=W<520?8:56,pb=26,pt=10,n=data.length;const mx=Math.max(1,...data.map(d=>Math.max(d.t,d.a,d.cost)))*1.1;const bw=(W-pl-10)/n;const y=v=>pt+(H-pt-pb)*(1-v/mx);
    let h='';if(W>=520)for(let i=0;i<=4;i++){const v=mx*i/4;h+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v/1000)}k</text>`}
    data.forEach((d,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;h+=`<rect x="${x}" y="${y(d.t)}" width="${w}" height="${H-pb-y(d.t)}" fill="var(--line)" rx="4"/><rect x="${x+w*.18}" y="${y(d.a)}" width="${w*.64}" height="${H-pb-y(d.a)}" fill="var(--berry)" rx="3"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${mshort(d.m)}</text>`});
    h+=`<polyline fill="none" stroke="var(--brass)" stroke-width="2.5" points="${data.map((d,i)=>(pl+i*bw+bw/2)+','+y(d.cost)).join(' ')}"/>`+data.map((d,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${y(d.cost)}" r="4" fill="var(--brass)"/>`).join('');svg.innerHTML=h};
  draw();if(drawMom.ro)drawMom.ro.disconnect();drawMom.ro=new ResizeObserver(draw);drawMom.ro.observe(f)}

/* ================= DOCUMENTS ================= */
function docTable(ds,emp){return ds.length?`<table class="stack"><thead><tr><th>Document</th>${emp?'':'<th>Employee</th>'}<th>Created</th><th>Status</th><th></th></tr></thead><tbody>${ds.map(d=>{const[s,c]=docStatus(d);return`<tr><td><b>${esc(d.title)}</b><br><span class="small muted">${d.fp}</span></td>${emp?'':`<td>${esc(E(d.empId).name)}</td>`}<td class="small">${fdt(d.created)}</td><td>${chip(s,c)}</td><td><button class="btn s ${d.status!=='completed'&&nextSigner(d)===(isOwner()?'employer':'employee')?'p':''}" data-act="doc" data-id="${d.id}">${d.status!=='completed'&&nextSigner(d)===(isOwner()?'employer':'employee')?'Review & sign':'View'}</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No documents yet.</div>'}
VIEWS.documents=()=>{const [tb,cur]=tabs('documents',[['me','Waiting for you'],['emp','Waiting for employee'],['all','All documents'],['tpl','Templates']]);
  let ds=S.docs.filter(d=>!['void','hold'].includes(d.status)&&E(d.empId)&&E(d.empId).status!=='exited'&&inScope(E(d.empId)));if(cur==='me')ds=ds.filter(d=>d.status!=='completed'&&nextSigner(d)==='employer');if(cur==='emp')ds=ds.filter(d=>d.status!=='completed'&&nextSigner(d)==='employee');
  const body=cur==='tpl'?`<p class="sub">Standard templates for all salons, drafted for the Labour Codes in force since 21 November 2025. Placeholders fill from the employee record.</p><table class="stack"><thead><tr><th>Template</th><th>Signed by</th><th>Used in</th></tr></thead><tbody>${Object.entries(TPL).map(([k,t])=>`<tr><td><b>${esc(t.title)}</b></td><td>${t.signers.map(s=>s==='employer'?'Employer':'Employee').join(' → ')}</td><td class="small muted">${{joining:'Onboarding',appointment:'Onboarding',nda:'Onboarding',handbook:'Onboarding',bgv:'BGV',confirmation:'Probation',warning:'Discipline',showcause:'Discipline',termination:'Exit',resign_accept:'Exit',relieving:'Exit',experience:'Exit',fnf:'Exit',exit:'Exit'}[k]}</td></tr>`).join('')}</tbody></table>`:docTable(ds);
  return head('Documents & e-sign','Every letter is generated from the record, signed by both sides with OTP, fingerprinted and kept with an audit trail.')+tb+`<div class="card">${body}</div>`};
ACT.doc=el=>docModal(el.dataset.id);
function docModal(id){const d=S.docs.find(x=>x.id===id),e=E(d.empId),me=isOwner()?'employer':'employee';const n=nextSigner(d);const canSign=d.status!=='completed'&&n===me&&(isOwner()?(isBoss()||(user()&&user().perms.docs)):S.ui.role===d.empId);
  openModal(`<h2>${esc(d.title)}</h2><p class="sub">${esc(e.name)} · ${chip(...docStatus(d))}</p>${docHTML(d)}
  <details style="margin-top:10px"><summary class="small">Audit trail</summary><div class="list small">${d.audit.map(a=>`<div><span class="muted" style="width:150px">${fdt(a.at)}</span><span class="sp">${esc(a.text)}</span></div>`).join('')}</div></details>
  ${canSign?signUI(me==='employer'?(user()?user().name:S.settings.owner):e.name,me==='employee'?e.phone:(user()?user().phone:S.settings.phone)):`<p class="small muted" style="margin-top:10px">${d.status==='completed'?'Fully signed. The live version downloads this as a signed PDF.':n?'Waiting for '+(n==='employer'?'the employer'+(isOwner()&&!isBoss()&&!(user()&&user().perms.docs)?' (owner, or a manager with signing permission)':''):'the employee')+' to sign.':''}</p>`}
  ${isOwner()&&can('staff')&&d.status!=='completed'?`<div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn s bad" data-act="voidDoc" data-id="${d.id}">Withdraw document</button></div>`:''}`,()=>{if(canSign)mountSign(name=>signDoc(d,me,name))})}
function signUI(name,phone){return`<div class="card" style="margin-top:14px;background:var(--blush)"><h3>Sign electronically</h3><div class="tabs" style="margin-top:8px"><button type="button" class="on" data-m="type">Type</button><button type="button" data-m="draw">Draw</button></div>
  <div id="sgType"><label class="f">Full name as signature<input id="sgName" value="${esc(name)}"></label></div><div id="sgDraw" hidden><canvas class="pad" id="pad"></canvas><button type="button" class="btn s" id="padClr" style="margin-top:6px">Clear</button></div>
  <div class="fg" style="margin-top:10px"><label class="f">OTP sent to ${esc(phone)} (demo OTP 123456)<input id="sgOtp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></label></div>
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="sgOk"> I have read this document and agree to sign it electronically under the Information Technology Act, 2000.</label>
  <button class="btn p" id="sgGo" style="margin-top:12px;width:100%">Sign document</button></div>`}
function mountSign(done){let mode='type',drawn=false;const c=$('#pad'),ctx=c.getContext('2d');
  const fit=()=>{c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.scale(2,2);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#173a8a'};
  document.querySelectorAll('#mbody-hrms .card .tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mbody-hrms .card .tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#sgType').hidden=mode!=='type';$('#sgDraw').hidden=mode!=='draw';if(mode==='draw')fit()});
  let down=false;const pos=ev=>{const r=c.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top]};
  c.onpointerdown=ev=>{down=true;drawn=true;ctx.beginPath();ctx.moveTo(...pos(ev));c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!down)return;ctx.lineTo(...pos(ev));ctx.stroke()};c.onpointerup=()=>down=false;
  $('#padClr').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);drawn=false};
  $('#sgGo').onclick=()=>{if($('#sgOtp').value!=='123456')return toast('Enter the OTP (demo: 123456)');if(!$('#sgOk').checked)return toast('Tick the consent box');
    const nm=$('#sgName').value.trim();if(!nm)return toast('Type your name');if(mode==='draw'&&!drawn)return toast('Draw your signature');
    done({name:nm,img:mode==='draw'?c.toDataURL('image/png'):null,method:(mode==='draw'?'Drawn':'Typed')+' + OTP'})}}
function signDoc(d,who,s){d.signs[who]={name:s.name,img:s.img,method:s.method,at:new Date().toISOString(),device:navigator.userAgent.slice(0,60)};d.audit.push({at:new Date().toISOString(),text:`Signed by ${who} (${s.name}) · ${s.method} · fingerprint ${d.fp}`});
  const n=nextSigner(d);if(!n){d.status='completed';d.audit.push({at:new Date().toISOString(),text:'All parties signed — document completed'});onDocComplete(d)}else{d.status='awaiting_'+n;d.audit.push({at:new Date().toISOString(),text:'Sent to '+n+' for signature'})}
  audit(`${d.title} signed by ${who==='employer'?'employer':s.name}`);closeModal();render();toast(n?'Signed and sent to '+(n==='employer'?'employer':'employee'):'Document completed')}
function onDocComplete(d){const e=E(d.empId);if(d.type==='handbook')S.acks[e.id]=todayS;if(d.type==='bgv'){const o=S.bgv.find(b=>b.empId===e.id&&!b.consent);if(o){o.consent=true;o.status='In progress'}}}
ACT.voidDoc=el=>{const d=S.docs.find(x=>x.id===el.dataset.id);d.status='void';d.audit.push({at:new Date().toISOString(),text:'Withdrawn by employer'});audit('Withdrew '+d.title);closeModal();render()};

/* ================= SEPARATIONS ================= */
const SPS={submitted:['Resignation received','c-warn'],showcause:['Show-cause issued','c-warn'],accepted:['Notice / return of property','c-info'],fnf:['F&F computed','c-info'],closed:['Closed','c-ok'],withdrawn:['Withdrawn','']};
const addWD=(ds,n)=>{let d=ds;while(n>0){d=addDays(d,1);if(dow(d)!==0)n--}return d};
VIEWS.separations=()=>{const list=S.seps.filter(s=>E(s.empId)&&!E(s.empId).archived&&inScope(E(s.empId))).sort((a,b)=>a.submittedOn<b.submittedOn?1:-1);
  return head('Exits','Resignations, disciplinary cases and terminations — property return first, then F&F, relieving and experience letters.')+
  `<div class="card">${list.length?`<table class="stack"><thead><tr><th>Employee</th><th>Type</th><th>Started</th><th>Last working day</th><th>Property</th><th>Stage</th></tr></thead><tbody>${list.map(s=>{const e=E(s.empId),as=e.assets||[];const ok=as.filter(a=>['approved','lost'].includes(a.status)).length;return`<tr class="click" data-act="sep" data-id="${s.id}"><td><b>${esc(e.name)}</b><br><span class="small muted">${esc(e.designation)} · ${esc(bn(e))}</span></td><td>${s.type==='resignation'?'Resignation':'Termination'}</td><td>${fdate(s.submittedOn)}</td><td>${fdate(s.lwd||s.reqLWD)}</td><td>${as.length?chip(ok+'/'+as.length+' cleared',ok===as.length?'c-ok':'c-warn'):'—'}${as.some(a=>a.status==='declared')?' '+chip('To approve','c-bad'):''}</td><td>${chip(...(SPS[s.status]||[s.status]))}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No exits in progress.</div>'}</div>
  <div class="card"><h3>How exits work</h3><p class="small muted">Employee resigns in the app → you accept and fix the last working day (or waive notice) → the employee returns every item issued to them and marks it in the app → a manager or the owner approves each return (or marks it not returned, so its value is recovered) and clears the checklist → only then is F&F computed. The F&F is visible and signed on both sides and paid within 2 working days of the last day (Code on Wages, 2019). Relieving and experience letters are issued after payment.</p></div>`};
ACT.sep=el=>sepModal(el.dataset.id);
function noticeDays(e){return e.type==='Probation'?S.settings.noticeProb:S.settings.noticeConf}
const clearanceState=(s,e)=>{const as=e.assets||[],c=s.checklist||{};const assetsOk=as.every(a=>['approved','lost'].includes(a.status));const chkOk=S.settings.checklist.every((k,i)=>c['c'+i]);return{assetsOk,chkOk,ok:assetsOk&&chkOk&&!!s.clearance}};
function sepModal(id){S.ui.sepOpen=id;const s=S.seps.find(x=>x.id===id),e=E(s.empId);let act='';const cs=clearanceState(s,e);
  if(s.status==='submitted')act=`<h3>Accept resignation</h3><p class="sub">Notice period for ${esc(e.type.toLowerCase())} staff: ${noticeDays(e)} days → ${fdate(addDays(s.submittedOn,noticeDays(e)))}. Employee asked for ${fdate(s.reqLWD)}.</p><div class="fg"><label class="f">Last working day<input type="date" id="lwd" value="${s.reqLWD>addDays(s.submittedOn,noticeDays(e))?s.reqLWD:addDays(s.submittedOn,noticeDays(e))}"></label><label class="chk" style="align-self:end"><input type="checkbox" id="waive"> Waive the remaining notice (no recovery)</label></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" data-act="sepAccept" data-id="${s.id}">Accept & issue letter</button></div>`;
  if(s.status==='showcause')act=`<h3>Decide the case</h3><p class="sub">Charge: ${esc(s.sc.reason)}</p>${s.sc.reply?`<div class="note i"><b>Employee reply (${fdt(s.sc.repliedAt)}):</b> ${esc(s.sc.reply)}</div>`:`<div class="note">No reply yet. Reply window closes ${fdt(new Date(new Date(s.sc.at).getTime()+72*36e5).toISOString())}.</div>`}
    ${isBoss()?`<div class="fg" style="margin-top:12px"><label class="f">Decision<select id="dec"><option value="drop">Close — charges not proved</option><option value="warning">Issue written warning</option><option value="terminate">Terminate for proved misconduct</option></select></label><label class="f">Termination date (if terminating)<input type="date" id="lwd" value="${todayS}"></label></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" data-act="sepDecide" data-id="${s.id}">Record decision</button></div>`:'<p class="small muted">The owner records the decision.</p>'}`;
  if(s.status==='accepted'||s.status==='fnf'){const c=s.checklist||{};
    act=`<h3>1. Return of salon property</h3><p class="sub">The employee marks each item returned in the staff app; you approve it here.</p><table><tbody>${(e.assets||[]).map(a=>`<tr><td>${esc(a.name)} × ${a.qty}<br><span class="small muted">Value ${inr(a.value*a.qty)}</span></td><td>${astChip(a)}</td><td>${['issued','declared'].includes(a.status)&&!s.fnf?`<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn s ok" data-act="astSet" data-id="${e.id}" data-a="${a.id}" data-v="approved">Approve return</button><button class="btn s bad" data-act="astSet" data-id="${e.id}" data-a="${a.id}" data-v="lost">Not returned</button></span>`:''}</td></tr>`).join('')||'<tr><td class="muted">No items were issued.</td></tr>'}</tbody></table>
    <h3 style="margin-top:14px">2. Exit checklist</h3><div class="grid g2" style="margin-top:6px">${S.settings.checklist.map((k,i)=>`<label class="chk"><input type="checkbox" data-change="chk" data-id="${s.id}" data-k="c${i}" ${c['c'+i]?'checked':''} ${s.fnf?'disabled':''}> ${esc(k)}</label>`).join('')}</div>
    <p class="small" style="margin-top:10px">Exit interview: ${s.exit?chip('Submitted by employee','c-ok'):chip('Waiting for employee','c-warn')}</p>
    <h3 style="margin-top:14px">3. Clearance approval</h3>${s.clearance?`<div class="note i">Cleared by ${esc(s.clearance.by)} on ${fdt(s.clearance.at)}.</div>`:`<div class="row"><span class="sp small ${cs.assetsOk&&cs.chkOk?'':'muted'}">${cs.assetsOk?'All property settled.':'Waiting for property returns.'} ${cs.chkOk?'Checklist complete.':'Checklist pending.'}</span><button class="btn ok" data-act="clearOk" data-id="${s.id}" ${cs.assetsOk&&cs.chkOk?'':'disabled'}>Approve clearance</button></div>`}
    <h3 style="margin-top:14px">4. Full & final settlement</h3>${s.fnf?fnfTable(s)+fnfDocState(s):(cs.ok&&isBoss()?`<div class="fg"><label class="f">Other recoveries (₹)<input type="number" id="rec" min="0" value="0"></label><label class="f">Other payable (₹)<input type="number" id="pay" min="0" value="0"></label><label class="f">Conduct on experience letter<select id="cond"><option>good</option><option>very good</option><option>satisfactory</option></select></label></div><div class="row" style="margin-top:10px"><span class="sp small muted">Salary to last day, leave encashment, notice, gratuity, unreturned property and statutory deductions.</span><button class="btn p" data-act="fnfCalc" data-id="${s.id}">Compute F&F</button></div>`:`<p class="small muted">${cs.ok?'The owner computes F&F.':'Locked until clearance is approved.'}</p>`)}
    ${s.fnf&&!s.fnf.paid&&isBoss()?`<div class="row" style="margin-top:12px"><span class="sp small">Pay by <b>${fdate(s.fnf.due)}</b> (2 working days after last day)</span><button class="btn ok" data-act="fnfPaid" data-id="${s.id}">Mark paid, relieve & close</button></div>`:''}`}
  if(s.status==='closed')act=(s.fnf?fnfTable(s):'')+`<div class="note i" style="margin-top:10px">Closed. Letters and the F&F statement are in Documents for both sides.</div>`;

VIEWS.resign=()=>{const e=ME(),s=S.seps.filter(x=>x.empId===e.id&&!['withdrawn'].includes(x.status)).pop();
  if(e.status==='exited')return head('My exit','Last working day '+fdate(e.lwd))+`<div class="card"><h2>Full & final settlement</h2>${s&&s.fnf?fnfTable(s):'<p class="muted">No settlement on record.</p>'}</div><div class="card"><h2>Your records</h2><p class="small muted">Payslips and letters (appointment, relieving, experience, F&F) are under the other tabs. Save copies before ${fdate(purgeOn(e))}, when your access ends and your personal details are deleted. The salon keeps only the registers the law requires.</p></div>`;
  if(s&&s.status==='showcause')return head('Show-cause notice','Reply within 72 hours')+`<div class="card"><p><b>Allegation:</b> ${esc(s.sc.reason)}</p>${s.sc.reply?`<div class="note i">Your reply was sent ${fdt(s.sc.repliedAt)}.</div>`:`<label class="f">Your explanation<textarea id="scr"></textarea></label><div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn p" data-act="scReply" data-id="${s.id}">Send reply</button></div>`}</div>`;
  if(s&&s.status!=='closed'){const done=s.exit;if(s.status==='closed')return'';return head(s.type==='resignation'?'My resignation':'Exit',chip(...(SPS[s.status]||[s.status])))+
    `<div class="card"><div class="list"><div><span class="sp">Submitted</span><b>${fdate(s.submittedOn)}</b></div><div><span class="sp">Last working day</span><b>${fdate(s.lwd||s.reqLWD)}${s.lwd?'':' (requested)'}</b></div>${s.fnf?`<div><span class="sp">Full & final amount</span><b>${inr(s.fnf.net)} · due ${fdate(s.fnf.due)}</b></div>`:''}</div>
    ${s.status==='submitted'?`<div class="row" style="margin-top:12px"><span class="sp small muted">Changed your mind? You can withdraw until the owner accepts.</span><button class="btn bad" data-act="withdraw" data-id="${s.id}">Withdraw</button></div>`:''}</div>
    ${['accepted','fnf'].includes(s.status)?`<div class="card"><h2>Step 1 · Return salon property</h2><p class="sub">Hand each item to your manager, then tap "I've returned it". Your F&F is processed only after every return is approved.</p><table><tbody>${(e.assets||[]).map(a=>`<tr><td>${esc(a.name)} × ${a.qty}</td><td>${astChip(a)}</td><td>${a.status==='issued'?`<button class="btn s p" data-act="astDeclare" data-a="${a.id}">I've returned it</button>`:''}</td></tr>`).join('')||'<tr><td class="muted">No items were issued to you.</td></tr>'}</tbody></table></div>
    <div class="card"><h2>Step 2 · Exit interview</h2>${done?'<div class="note i">Thank you — submitted.</div>':`<form id="fexit">${S.settings.exitQs.map((q,i)=>`<label class="f" style="margin-top:10px">${esc(q)}<input name="q${i}"></label>`).join('')}<label class="chk" style="margin-top:14px"><input type="checkbox" name="pool"> Optional: share my name, designation, city and experience with other salons hiring through Salon HR, so they can offer me jobs. I can withdraw this any time.</label><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p">Submit</button></div></form>`}</div>
    <div class="card"><h2>Step 3 · Clearance</h2>${S.settings.checklist.map((k,i)=>`<div class="check"><span class="ic" style="background:${(s.checklist||{})['c'+i]?'var(--okb)':'var(--line)'}">${(s.checklist||{})['c'+i]?'✓':''}</span><span>${esc(k)}</span></div>`).join('')}<p class="small" style="margin-top:8px">${s.clearance?chip('Clearance approved by '+s.clearance.by,'c-ok'):chip('Waiting for manager / owner approval','c-warn')}</p></div>`:''}
    ${s.fnf?`<div class="card"><h2>Step 4 · Your full & final settlement</h2>${fnfTable(s)}${fnfDocState(s)}<p class="small muted" style="margin-top:8px">Questions about any line? Raise a Payroll ticket in Helpdesk before you sign.</p><button class="btn p" data-act="go" data-v="mydocs" style="margin-top:8px">Review & sign F&F statement</button></div>`:''}`}
  const nd=noticeDays(e);
  return head('Resign','Your notice period is '+nd+' days ('+esc(e.type.toLowerCase())+'). Resignations are only accepted through the HRMS.')+
  `<div class="card"><form id="fres" class="fg"><label class="f">Main reason<select name="cat">${['Better opportunity','Relocation','Higher studies','Health / family','Starting own salon','Compensation','Work environment','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Preferred last working day<input type="date" name="lwd" value="${addDays(todayS,nd)}"></label><label class="f" style="grid-column:1/-1">Resignation note<textarea name="why" required></textarea></label><div class="note" style="grid-column:1/-1">If your last day is earlier than ${fdate(addDays(todayS,nd))}, the shortfall may be recovered from your final settlement unless the owner waives it.</div><div><button class="btn bad">Submit resignation</button></div></form></div>
  ${s&&s.status==='closed'?`<div class="card"><h2>Your last exit</h2>${s.fnf?fnfTable(s):''}<p class="small muted" style="margin-top:8px">Relieving letter, experience certificate and F&F statement are in Documents.</p></div>`:''}`};

  if(f.id==='fres'){ev.preventDefault();const why=fval(f,'why');if(!why)return toast('Write a short note');const s={id:uid('sp'),empId:e.id,type:'resignation',status:'submitted',submittedOn:todayS,reasonCat:fval(f,'cat'),reason:why,reqLWD:fval(f,'lwd'),timeline:[],checklist:{},exit:null,fnf:null};tl(s,'Resignation submitted via HRMS',e.name);S.seps.push(s);audit('Resignation submitted',e.name);render();toast('Submitted to owner')}

function empUpdates(e){const own=e.name;const items=S.audit.filter(a=>a.text.includes(own)&&!String(a.by).startsWith(own)).slice(0,6).map(a=>[a.at,a.text]);
  const ms=Object.keys(S.payroll).sort().reverse().filter(m=>S.payroll[m].rows.some(r=>r.empId===e.id));if(ms[0])items.push([S.payroll[ms[0]].at,'Payslip for '+mname(ms[0])+' released']);

  const cell=(e,ds)=>{const r=rosterOf(e,ds)||'',lv=leaveOn(e.id,ds),h=isHol(ds),locked=!!S.payroll[ds.slice(0,7)]||ds<e.doj;const def=dow(ds)===e.weeklyOff?'Off (fixed)':shiftOf(e).name;

/* ================= OVERVIEW ================= */
VIEWS.overview=()=>{const ts=myT(),act=ts.filter(t=>t.status==='Active');const staff=act.reduce((a,t)=>a+t.staff,0),mrr=act.reduce((a,t)=>a+monthly(t),0);
  const reqs=S.reqs.filter(r=>r.status!=='Resolved'&&ts.some(t=>t.id===r.tenant));const comp=ts.flatMap(compFor).filter(c=>!c.done).sort((a,b)=>a.due<b.due?-1:1);
  const leadsM=S.leads.filter(l=>l.at.slice(0,7)===curMK).length;const overdue=S.invoices.filter(i=>i.status==='Overdue');
  return head(isSuper()?'Salon HR at a glance':'My salons',isSuper()?'Every salon, lead, invoice and request on the platform.':'Only the salons assigned to you.')+
  `<div class="grid g4" style="margin-bottom:16px"><div class="kpi"><b>${act.length}</b><span>Active salons${ts.length>act.length?' · '+(ts.length-act.length)+' other':''}</span></div><div class="kpi"><b>${staff}</b><span>Staff on HRMS</span></div>${isSuper()?`<div class="kpi"><b>${inr(mrr)}</b><span>Monthly recurring revenue (excl. GST)</span></div><div class="kpi"><b>${leadsM}</b><span>New leads this month</span></div>`:`<div class="kpi"><b>${reqs.length}</b><span>Open requests</span></div><div class="kpi"><b>${comp.length}</b><span>Compliance tasks pending</span></div>`}</div>
  <div class="grid g2"><div class="card"><h2>Requests waiting</h2>${reqs.length?`<div class="list">${reqs.slice(0,6).map(r=>`<div class="click" data-act="req" data-id="${r.id}" style="cursor:pointer"><span class="sp"><b>${esc(r.title)}</b><br><span class="small muted">${esc(T(r.tenant).salon)} · ${fdate(r.at)}</span></span>${chip(r.status,r.status==='Open'?'c-warn':'c-info')}</div>`).join('')}</div>`:'<div class="empty">Nothing waiting.</div>'}</div>
  <div class="card"><h2>Compliance due this month</h2>${comp.length?`<div class="list">${comp.slice(0,7).map(c=>`<div><span class="sp"><b>${esc(c.label)}</b><br><span class="small muted">${esc(c.t.salon)}</span></span>${chip('Due '+fdate(c.due),c.due<todayS?'c-bad':'c-warn')}</div>`).join('')}</div>`:'<div class="empty">All filed for this month.</div>'}</div></div>
  ${isSuper()?`<div class="grid g2"><div class="card"><h2>Pipeline</h2><div class="bars">${STAGES.map(s=>{const n=S.leads.filter(l=>l.stage===s).length;return`<div class="r"><span>${s}</span><div class="t"><i style="width:${Math.min(100,n*25)}%;background:${s==='Won'?'var(--ok)':s==='Lost'?'var(--bad)':'var(--berry)'}"></i></div><b class="n">${n}</b></div>`}).join('')}</div></div>
  <div class="card"><h2>Partner load</h2><div class="bars">${S.partners.map(p=>{const n=S.tenants.filter(t=>t.partner===p.id).length;return`<div class="r"><span>${esc(p.name.split(' ')[0])}</span><div class="t"><i style="width:${n/p.cap*100}%"></i></div><b class="n">${n}/${p.cap}</b></div>`}).join('')}</div>${S.tenants.some(t=>!t.partner)?`<p class="small" style="margin-top:10px">${chip(S.tenants.filter(t=>!t.partner).length+' salon(s) without an HR partner','c-bad')}</p>`:''}${overdue.length?`<p class="small" style="margin-top:6px">${chip(overdue.length+' overdue invoice(s)','c-bad')}</p>`:''}</div></div>`:''}`};

/* ================= SALONS ================= */
VIEWS.salons=()=>{const q=(S.ui.tab.q||'').toLowerCase();const st=S.ui.tab.st||'all';const L=myT().filter(t=>(st==='all'||t.status===st)&&(!q||(t.salon+' '+t.id+' '+t.city+' '+t.owner).toLowerCase().includes(q)));
  return head('Salons',`${myT().length} ${isSuper()?'on the platform':'assigned to you'} · each salon is a separate, isolated account`,isSuper()?`<button class="btn p" data-act="addT">Onboard a salon</button>`:'')+
  `<div class="card"><div class="row" style="margin-bottom:10px"><select data-change="tst" style="width:auto">${['all','Onboarding','Active','Suspended','Churned'].map(x=>`<option value="${x}"${x===st?' selected':''}>${x==='all'?'All statuses':x}</option>`).join('')}</select><input type="search" placeholder="Search salon, ID, city or owner" value="${esc(S.ui.tab.q||'')}" data-change="tq" style="max-width:320px"></div>
  <div class="scroll"><table class="stack"><thead><tr><th>Salon</th><th>Owner</th><th>Plan</th><th class="n">Branches</th><th class="n">Staff</th><th>HR partner</th>${isSuper()?'<th class="n">Monthly</th>':''}<th>Status</th></tr></thead><tbody>${L.map(t=>`<tr class="click" data-act="ten" data-id="${t.id}"><td><b>${esc(t.salon)}</b><br><span class="small muted">${t.id} · ${esc(t.city)}</span></td><td>${esc(t.owner)}<br><span class="small muted">${t.ownerPhone}</span></td><td>${esc(S.plans.find(p=>p.id===t.plan).name)}${t.addons.length?'<br><span class="small muted">+'+t.addons.length+' add-on(s)</span>':''}</td><td class="n">${t.branches}</td><td class="n">${t.staff}</td><td>${t.partner?esc(PT(t.partner).name):chip('Unassigned','c-bad')}</td>${isSuper()?`<td class="n">${inr(monthly(t))}</td>`:''}<td>${chip(t.status,TSTC[t.status])}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No salons match.</td></tr>'}</tbody></table></div></div>`};
CH.tst=el=>{S.ui.tab.st=el.value;render()};CH.tq=el=>{S.ui.tab.q=el.value;render()};
ACT.ten=el=>tenModal(el.dataset.id);
function tenModal(id,tab){const t=T(id);S.ui.tab.ten=tab||S.ui.tab.ten||'ov';const [tb,cur]=tabs('ten',[['ov','Overview'],['svc','Plan & services'],['users','Logins'],...(isSuper()?[['bill','Billing']]:[]),['req','Requests'],['support','Support access']]);let b='';
  if(cur==='ov')b=`<form id="ften" class="fg"><label class="f">Brand name<input name="salon" value="${esc(t.salon)}" ${isSuper()?'':'disabled'}></label><label class="f">Legal entity<input name="legal" value="${esc(t.legal)}" ${isSuper()?'':'disabled'}></label><label class="f">GSTIN<input name="gstin" value="${esc(t.gstin)}" ${isSuper()?'':'disabled'}></label><label class="f">City<input name="city" value="${esc(t.city)}" ${isSuper()?'':'disabled'}></label><label class="f">State<input name="state" value="${esc(t.state)}" ${isSuper()?'':'disabled'}></label><label class="f">Branches<input type="number" name="branches" value="${t.branches}" ${isSuper()?'':'disabled'}></label><label class="f">Staff on HRMS<input type="number" name="staff" value="${t.staff}" disabled></label><label class="f">Client since<input value="${fdate(t.since)}" disabled></label>
    <label class="f">HR partner<select name="partner" ${isSuper()?'':'disabled'}><option value="">Unassigned</option>${S.partners.filter(p=>p.active).map(p=>`<option value="${p.id}"${p.id===t.partner?' selected':''}>${esc(p.name)} (${S.tenants.filter(x=>x.partner===p.id).length}/${p.cap})</option>`).join('')}</select></label>
    <label class="f">Status<select name="status" ${isSuper()?'':'disabled'}>${['Onboarding','Active','Suspended','Churned'].map(s=>`<option${s===t.status?' selected':''}>${s}</option>`).join('')}</select></label>${isSuper()?'<div style="align-self:end"><button class="btn p">Save</button></div>':''}</form>
    ${t.status==='Onboarding'?`<div class="note" style="margin-top:12px"><b>Onboarding checklist:</b> owner invite sent · branches & shifts set up · leave types & pay rules · staff invited · first payroll run with the HR partner.</div>`:''}`;
  if(cur==='svc'){const p=S.plans.find(x=>x.id===t.plan);b=`<div class="row" style="margin-bottom:12px"><label class="f" style="width:auto">Plan<select data-change="tplan" data-id="${t.id}" ${isSuper()?'':'disabled'} style="width:auto">${S.plans.map(x=>`<option value="${x.id}"${x.id===t.plan?' selected':''}>${esc(x.name)} · ${inr(x.price)}/month · up to ${x.upto} staff</option>`).join('')}</select></label>${t.staff>p.upto?chip('Over plan limit — suggest upgrade','c-bad'):''}</div>
    <p class="sub" style="margin-bottom:8px">Ticked services appear as "Active" in the salon's portal and unlock that module in their HRMS. Services in the plan are included; anything else is billed as an add-on.</p><div class="grid g2">${SVC.map(s=>{const inPlan=p.services.includes(s[0]),on=t.services.includes(s[0]);return`<label class="chk"><input type="checkbox" data-change="tsvc" data-id="${t.id}" data-s="${s[0]}" ${on?'checked':''} ${inPlan||!isSuper()?'disabled':''}> ${esc(s[1])} ${inPlan?chip('In plan','c-ok'):on?chip('Add-on','c-info'):''}</label>`}).join('')}</div>${isSuper()?'':'<p class="small muted" style="margin-top:10px">Only the super admin changes plans and services. Raise it from the salon\'s request.</p>'}`}
  if(cur==='users')b=`<table class="stack"><thead><tr><th>Person</th><th>Role</th><th>Mobile</th><th>Access</th><th></th></tr></thead><tbody><tr><td><b>${esc(t.owner)}</b></td><td>Owner</td><td>${t.ownerPhone}</td><td>All branches, all modules</td><td>${isSuper()?`<button class="btn s" data-act="ownerPh" data-id="${t.id}">Change owner mobile</button>`:''} <button class="btn s" data-act="invite" data-id="${t.id}">Resend invite</button></td></tr>${t.managers?`<tr><td colspan="5" class="small muted">${t.managers} manager login(s) created by the owner in their HRMS (Branches & managers).</td></tr>`:''}<tr><td colspan="5" class="small muted">${t.staff} staff log in to the staff app with their own mobile + OTP. Logins are unique per salon; a mobile can be active in only one salon at a time.</td></tr></tbody></table>`;
  if(cur==='bill'){const iv=S.invoices.filter(i=>i.tenant===t.id).sort((a,b)=>a.mk<b.mk?1:-1);b=`<div class="list"><div><span class="sp">Current monthly charge (excl. GST)</span><b>${inr(monthly(t))}</b></div></div>${invTable(iv,false)}`}
  if(cur==='req'){const rs=S.reqs.filter(r=>r.tenant===t.id);b=reqTable(rs,false)}
  if(cur==='support')b=`<p>Open this salon's HRMS admin to help the owner — fix a punch, set up a shift, run payroll with them.</p><div class="note i" style="margin:12px 0">Every support session is logged with your name and time, and the owner sees a "Salon HR support is viewing your account" banner. ${isSuper()?'':'You can only open salons assigned to you.'}</div>${t.id==='AURA01'?`<a class="btn p" href="#app-admin" data-act="support" data-id="${t.id}">Open ${esc(t.salon)} admin as support</a>`:`<button class="btn p" disabled>Open ${esc(t.salon)} admin as support</button><p class="small muted" style="margin-top:10px">In this demo only Aura Salon & Spa (AURA01) has a live salon admin. In the live platform every salon opens its own account.</p>`}`;
  openModal(`<h2>${esc(t.salon)}</h2><p class="sub">${t.id} · ${esc(t.city)}, ${esc(t.state)} · ${chip(t.status,TSTC[t.status])}</p>${tb}<div>${b}</div>`,()=>{
    document.querySelectorAll('#mbody-console .tabs button').forEach(x=>x.onclick=()=>tenModal(id,x.dataset.v));
    const f=$('#ften');if(f&&isSuper())f.onsubmit=ev=>{ev.preventDefault();['salon','legal','gstin','city','state'].forEach(k=>t[k]=fv(f,k));t.branches=+fv(f,'branches')||1;const op=t.partner;t.partner=fv(f,'partner')||null;t.status=fv(f,'status');if(op!==t.partner)audit(`Assigned ${t.salon} to ${t.partner?PT(t.partner).name:'nobody'}`);audit('Updated salon '+t.salon);render();tenModal(id,'ov');toast('Saved')}})}
CH.tplan=el=>{const t=T(el.dataset.id);t.plan=el.value;const p=S.plans.find(x=>x.id===t.plan);t.services=[...new Set([...p.services,...t.addons])];audit(`${t.salon} moved to ${p.name} plan`);render();tenModal(t.id,'svc');toast('Plan updated — salon portal and HRMS modules updated')};
CH.tsvc=el=>{const t=T(el.dataset.id),s=el.dataset.s;if(el.checked){t.addons.push(s);t.services.push(s)}else{t.addons=t.addons.filter(x=>x!==s);t.services=t.services.filter(x=>x!==s)}audit(`${el.checked?'Enabled':'Disabled'} ${svcName(s)} for ${t.salon}`);render();tenModal(t.id,'svc')};
ACT.invite=el=>{const t=T(el.dataset.id);audit('Resent owner invite to '+t.salon);toast('Invite sent to '+t.owner+' by SMS & WhatsApp')};
ACT.ownerPh=el=>{const t=T(el.dataset.id);openModal(`<h2>Change owner mobile — ${esc(t.salon)}</h2><p class="sub">Use only after verifying the owner's identity (e.g. a call from the registered email). The old number loses access immediately.</p><form id="fph"><label class="f">New mobile<input name="m" inputmode="tel"></label><label class="f" style="margin-top:10px">Verification note<input name="n" placeholder="Verified via call + email from registered address"></label><button class="btn p" style="margin-top:12px">Change</button></form>`,()=>{$('#fph').onsubmit=ev=>{ev.preventDefault();const m=fv($('#fph'),'m').replace(/\D/g,'').slice(-10),n=fv($('#fph'),'n');if(!/^[6-9]\d{9}$/.test(m)||!n)return toast('Valid mobile and a verification note needed');audit(`Owner mobile of ${t.salon} changed (${n})`);t.ownerPhone=m;tenModal(t.id,'users');toast('Owner mobile changed')}})};
ACT.support=el=>{const t=T(el.dataset.id);audit('Support session opened for '+t.salon);save();if(PLATFORM.apps.hrms)PLATFORM.apps.hrms.support(me().name)};
ACT.addT=(el,prefill)=>{const l=prefill||{};openModal(`<h2>Onboard a salon</h2><p class="sub">Creates the salon's own account, sends the owner an invite and assigns an HR partner.</p><form id="fadd" class="fg">
  <label class="f">Brand name *<input name="salon" value="${esc(l.salon)}"></label><label class="f">Legal entity<input name="legal" value="${esc(l.salon?l.salon+' Pvt. Ltd.':'')}"></label><label class="f">City *<input name="city" value="${esc(l.city)}"></label><label class="f">State<input name="state" value="${esc(l.state)}"></label>
  <label class="f">Owner name *<input name="owner" value="${esc(l.name)}"></label><label class="f">Owner mobile *<input name="ph" value="${esc(l.mobile)}" inputmode="tel"></label><label class="f">Branches<input type="number" name="br" min="1" value="${parseInt(l.branches)||1}"></label><label class="f">Expected staff<input type="number" name="st" min="1" value="${parseInt(l.staff)||5}"></label>
  <label class="f">Plan<select name="plan">${S.plans.map(p=>`<option value="${p.id}">${esc(p.name)} · ${inr(p.price)}/month</option>`).join('')}</select></label><label class="f">HR partner<select name="partner">${S.partners.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} (${S.tenants.filter(x=>x.partner===p.id).length}/${p.cap})</option>`).join('')}</select></label>
  <div style="grid-column:1/-1"><button class="btn p">Create salon & send owner invite</button></div></form>`,()=>{$('#fadd').onsubmit=ev=>{ev.preventDefault();const f=$('#fadd');const ph=fv(f,'ph').replace(/\D/g,'').slice(-10);if(!fv(f,'salon')||!fv(f,'city')||!fv(f,'owner')||!/^[6-9]\d{9}$/.test(ph))return toast('Brand, city, owner and a valid mobile are required');
    const base=fv(f,'salon').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4).padEnd(4,'X');const id=base+pad(S.tenants.length+1);const p=S.plans.find(x=>x.id===fv(f,'plan'));
    S.tenants.push({id,salon:fv(f,'salon'),legal:fv(f,'legal'),city:fv(f,'city'),state:fv(f,'state'),plan:p.id,branches:+fv(f,'br')||1,staff:+fv(f,'st')||1,partner:fv(f,'partner'),status:'Onboarding',since:todayS,addons:[],services:p.services.slice(),owner:fv(f,'owner'),ownerPhone:ph,gstin:'',managers:0});
    if(l.id){const ld=S.leads.find(x=>x.id===l.id);ld.stage='Won';ld.tenant=id}
    audit(`Onboarded ${fv(f,'salon')} (${id}) on ${p.name}; invite sent to owner`);closeModal();S.ui.view='salons';render();toast(`${id} created — owner invite sent`)}})};

/* ================= LEADS ================= */
VIEWS.leads=()=>{const st=S.ui.tab.ls||'open';const L=S.leads.filter(l=>st==='all'||(st==='open'?!['Won','Lost'].includes(l.stage):l.stage===st)).sort((a,b)=>a.at<b.at?1:-1);
  return head('Sales leads','Every enquiry from the website form and "Talk To Your HR" call-backs lands here, and also in partners@salon10x.in.',`<button class="btn p" data-act="addL">Add lead</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">${['New','Demo scheduled','Proposal sent','Won'].map(s=>`<div class="kpi"><b>${S.leads.filter(l=>l.stage===s).length}</b><span>${s}</span></div>`).join('')}</div>
  <div class="card"><div class="row" style="margin-bottom:10px"><select data-change="ls" style="width:auto">${[['open','Open leads'],['all','All'],...STAGES.map(s=>[s,s])].map(o=>`<option value="${o[0]}"${o[0]===st?' selected':''}>${o[1]}</option>`).join('')}</select></div>
  <div class="scroll"><table class="stack"><thead><tr><th>Salon</th><th>Contact</th><th>Size</th><th>Interested in</th><th>Received</th><th>Stage</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td><b>${esc(l.salon)}</b><br><span class="small muted">${esc(l.city)}${l.state?', '+esc(l.state):''}</span></td><td>${esc(l.name)}<br><span class="small muted">${l.mobile}</span></td><td class="small">${esc(l.branches)} branch · ${esc(l.staff)} staff</td><td class="small">${esc(l.interests)}</td><td class="small">${fdate(l.at)}</td><td><select data-change="lstage" data-id="${l.id}" style="width:auto;min-height:34px;padding:4px 8px;font-size:13px">${STAGES.map(s=>`<option${s===l.stage?' selected':''}>${s}</option>`).join('')}</select>${l.next?`<br><span class="small muted">Next: ${fdate(l.next)}</span>`:''}</td><td>${l.tenant?chip('Salon '+l.tenant,'c-ok'):l.stage!=='Lost'?`<button class="btn s" data-act="convert" data-id="${l.id}">Convert to salon</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`};
CH.ls=el=>{S.ui.tab.ls=el.value;render()};
CH.lstage=el=>{const l=S.leads.find(x=>x.id===el.dataset.id);l.stage=el.value;audit(`Lead ${l.salon} → ${l.stage}`);if(l.stage==='Won'&&!l.tenant)return ACT.addT(null,l);render()};
ACT.convert=el=>ACT.addT(null,S.leads.find(x=>x.id===el.dataset.id));
ACT.addL=()=>openModal(`<h2>Add lead</h2><form id="fl" class="fg"><label class="f">Salon *<input name="s"></label><label class="f">Contact *<input name="n"></label><label class="f">Mobile *<input name="m" inputmode="tel"></label><label class="f">City<input name="c"></label><label class="f">Staff<select name="st"><option>1–9</option><option>10–19</option><option>20–49</option><option>50+</option></select></label><label class="f">Interested in<input name="i"></label><div><button class="btn p">Add</button></div></form>`,()=>{$('#fl').onsubmit=ev=>{ev.preventDefault();const f=$('#fl');if(!fv(f,'s')||!fv(f,'n')||!fv(f,'m'))return toast('Salon, contact and mobile needed');S.leads.push({id:'L'+(101+S.leads.length),salon:fv(f,'s'),name:fv(f,'n'),mobile:fv(f,'m'),city:fv(f,'c'),state:'',branches:'1',staff:fv(f,'st'),interests:fv(f,'i'),stage:'New',at:new Date().toISOString(),notes:[]});audit('Added lead '+fv(f,'s'));closeModal();render()}});

/* ================= REQUESTS ================= */
function reqTable(rs,showSalon=true){return rs.length?`<table class="stack"><thead><tr><th>Request</th>${showSalon?'<th>Salon</th><th>HR partner</th>':''}<th>Type</th><th>Raised</th><th>Status</th></tr></thead><tbody>${rs.sort((a,b)=>(a.status==='Resolved')-(b.status==='Resolved')||(a.at<b.at?1:-1)).map(r=>{const t=T(r.tenant),age=(Date.now()-new Date(r.at))/864e5;return`<tr class="click" data-act="req" data-id="${r.id}"><td><b>${esc(r.title)}</b><br><span class="small muted">${r.id}</span></td>${showSalon?`<td>${esc(t.salon)}</td><td>${t.partner?esc(PT(t.partner).name):chip('Unassigned','c-bad')}</td>`:''}<td>${chip(r.type==='service'?'Add service':r.type==='tech'?'Technical':'HR help',r.type==='service'?'c-b':r.type==='tech'?'c-info':'')}</td><td class="small">${fdate(r.at)}${r.status!=='Resolved'&&age>2?'<br>'+chip('Over 48h','c-bad'):''}</td><td>${chip(r.status,r.status==='Open'?'c-warn':r.status==='Resolved'?'c-ok':'c-info')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No requests.</div>'}
VIEWS.requests=()=>{const st=S.ui.tab.rs||'open';const rs=S.reqs.filter(r=>myT().some(t=>t.id===r.tenant)&&(st==='all'||(st==='open'?r.status!=='Resolved':r.type===st)));
  return head('Requests & support','Service add-on requests, HR help and technical issues raised by salons from their portal. 48-hour response target.')+`<div class="card"><div class="row" style="margin-bottom:10px"><select data-change="rs" style="width:auto">${[['open','Open'],['all','All'],['service','Add service'],['hr','HR help'],['tech','Technical']].map(o=>`<option value="${o[0]}"${o[0]===st?' selected':''}>${o[1]}</option>`).join('')}</select></div>${reqTable(rs)}</div>`};
CH.rs=el=>{S.ui.tab.rs=el.value;render()};
ACT.req=el=>{const r=S.reqs.find(x=>x.id===el.dataset.id),t=T(r.tenant);openModal(`<h2>${esc(r.title)}</h2><p class="sub">${r.id} · ${esc(t.salon)} (${t.id}) · raised ${fdt(r.at)} · ${chip(r.status)}</p><div class="note i" style="margin:10px 0">${esc(r.note)}</div>
  <div class="list">${r.msgs.map(m=>`<div><span class="chip c-b">${esc(m.by)}</span><span class="sp">${esc(m.text)}</span><span class="small muted">${fdt(m.at)}</span></div>`).join('')}</div>
  <label class="f" style="margin-top:12px">Reply to the salon<textarea id="rr"></textarea></label><div class="row" style="margin-top:10px">${r.type==='service'&&isSuper()&&r.status!=='Resolved'?`<button class="btn ok" data-act="reqEnable" data-id="${r.id}">Enable service & resolve</button>`:''}<span class="sp"></span><button class="btn" data-act="reqSend" data-id="${r.id}" data-s="In progress">Reply</button><button class="btn p" data-act="reqSend" data-id="${r.id}" data-s="Resolved">Reply & resolve</button></div>`)};

/* health score */
function health(t){if(t.status==='Suspended')return[10,'At risk','c-bad',['Account suspended']];if(t.status==='Churned')return[0,'Churned','',[]];let s=100;const why=[];
  if(S.invoices.some(i=>i.tenant===t.id&&i.status==='Overdue')){s-=30;why.push('Overdue invoice')}
  const old=S.reqs.filter(r=>r.tenant===t.id&&r.status!=='Resolved'&&(Date.now()-new Date(r.at))/864e5>2).length;if(old){s-=15*old;why.push(old+' request(s) open > 48h')}
  const ll=(new Date(todayS)-new Date(t.lastLogin))/864e5;if(ll>14){s-=25;why.push('No owner login for '+Math.round(ll)+' days')}else if(ll>7){s-=10;why.push('Low recent usage')}
  if(!t.partner){s-=20;why.push('No HR partner')}
  const p=S.plans.find(x=>x.id===t.plan);if(t.staff>p.upto){s-=5;why.push('Over plan staff limit')}
  s=Math.max(0,s);return[s,s>=70?'Healthy':s>=40?'Watch':'At risk',s>=70?'c-ok':s>=40?'c-warn':'c-bad',why]}
/* upsell ideas */
function ideas(t){if(t.status!=='Active')return[];const p=S.plans.find(x=>x.id===t.plan),out=[];const ad=id=>S.addons.find(a=>a.id===id);
  if(t.staff>p.upto){const up=S.plans.find(x=>x.upto>=t.staff&&x.price>p.price);if(up)out.push(['plan',`Upgrade to ${up.name}`,`${t.staff} staff on a plan for up to ${p.upto}`,up.price-p.price])}
  if(!t.services.includes('compliance')&&t.staff>=8)out.push(['compliance','PF & ESI management',t.staff>=10?`${t.staff} staff — ESI is mandatory at 10+`:`${t.staff} staff — ESI becomes mandatory at 10`,ad('compliance').price*t.staff]);
  if(!t.services.includes('performance')&&t.staff>=6)out.push(['performance','Performance & incentives','Track targets vs salary for every stylist',ad('performance').price]);
  if(!t.services.includes('recruitment'))out.push(['recruitment','Recruitment & sourcing','Fill chairs from the talent pool',ad('recruitment').price]);
  if(!t.services.includes('bgv')&&t.staff>=10)out.push(['bgv','Background verification','Verify new joiners before they start',ad('bgv').price]);
  return out}

/* patch the salon modal to add new tabs */
const EXTRA={contact:['Contacts',contactsTab],calls:['Call log',callsTab],opp:['Opportunities',oppTab],health:['Health',healthTab]};
const _tenModal=tenModal;
tenModal=function(id,tab){const t=T(id);const k=tab||S.ui.tab.ten||'contact';
  if(!EXTRA[k]){_tenModal(id,k);addTabs(id,k);return}
  _tenModal(id,'ov');S.ui.tab.ten=k;const tb=document.querySelector('#mbody-console .tabs');tb.querySelectorAll('button').forEach(b=>b.classList.remove('on'));addTabs(id,k);
  tb.nextElementSibling.innerHTML=EXTRA[k][1](t);bindCall()};
function addTabs(id,k){const tb=document.querySelector('#mbody-console .tabs');if(!tb)return;if(!tb.querySelector('[data-v="contact"]'))Object.entries(EXTRA).reverse().forEach(([kk,v])=>{const b=document.createElement('button');b.dataset.v=kk;b.textContent=v[0];tb.prepend(b)});
  tb.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===k);b.onclick=()=>tenModal(id,b.dataset.v)})}
function bindCall(){const f=$('#fcall');if(!f)return;f.onsubmit=ev=>{ev.preventDefault();const n=fv(f,'n');if(!n)return toast('Write what was discussed');S.calls.push({id:uid('c'),tenant:f.dataset.t,by:me().name,type:fv(f,'ty'),note:n,at:new Date().toISOString(),next:fv(f,'nx'),done:false});
  audit(`Logged ${fv(f,'ty').toLowerCase()} call with ${T(f.dataset.t).salon}`);render();tenModal(f.dataset.t,'calls');toast('Call logged')}}
ACT.pitch=el=>{S.ui.tab.ten='calls';tenModal(el.dataset.t,'calls');const f=$('#fcall');f.ty.value='Upsell';f.n.value='Pitched '+el.dataset.o+': ';f.n.focus()};
ACT.fuDone=el=>{const c=S.calls.find(x=>x.id===el.dataset.id);c.done=true;audit('Follow-up done: '+T(c.tenant).salon);render()};

/* --- overview additions: follow-ups & at-risk --- */
const _ov=VIEWS.overview;VIEWS.overview=()=>{const ts=myT();const fu=S.calls.filter(c=>c.next&&!c.done&&c.next<=addDays(todayS,2)&&ts.some(t=>t.id===c.tenant)).sort((a,b)=>a.next<b.next?-1:1);
  const risk=ts.map(t=>[t,health(t)]).filter(x=>x[1][0]<70&&x[0].status!=='Churned').sort((a,b)=>a[1][0]-b[1][0]);
  return _ov()+`<div class="grid g2"><div class="card"><h2>Follow-ups due</h2>${fu.length?`<div class="list">${fu.map(c=>{const t=T(c.tenant);return`<div><span class="sp"><b>${esc(t.salon)}</b> ${chip(c.type)}<br><span class="small muted">${esc(c.note)}</span></span>${chip(fdate(c.next),c.next<todayS?'c-bad':'c-warn')}<span class="row" style="gap:4px">${telL(t.ownerPhone)}<button class="btn s ok" data-act="fuDone" data-id="${c.id}">Done</button></span></div>`}).join('')}</div>`:'<div class="empty">No follow-ups due.</div>'}</div>
  <div class="card"><h2>Salons needing attention</h2>${risk.length?`<div class="list">${risk.map(([t,h])=>`<div class="click" data-act="ten" data-id="${t.id}" style="cursor:pointer"><span class="sp"><b>${esc(t.salon)}</b><br><span class="small muted">${esc(h[3].join(' · '))}</span></span>${chip(h[0]+' · '+h[1],h[2])}</div>`).join('')}</div>`:'<div class="empty">All salons healthy.</div>'}</div></div>`};

/* --- salons list: health column --- */
const _sal=VIEWS.salons;VIEWS.salons=()=>{let h=_sal();myT().forEach(t=>{const x=health(t);h=h.replace(`${chip(t.status,TSTC[t.status])}</td></tr>`,`${chip(t.status,TSTC[t.status])}<br>${chip('Health '+x[0],x[2])}</td></tr>`)});return h};

/* --- opportunities --- */
VIEWS.opps=()=>{const rows=myT().flatMap(t=>ideas(t).map(o=>({t,o}))).sort((a,b)=>b.o[3]-a.o[3]);const tot=rows.reduce((a,r)=>a+r.o[3],0);
  return head('Opportunities',`Services your salons don't have yet but clearly need · ${inr(tot)}/month potential`)+`<div class="card"><table class="stack"><thead><tr><th>Salon</th><th>Opportunity</th><th>Why</th><th class="n">Est. monthly</th><th>Owner</th><th></th></tr></thead><tbody>${rows.map(({t,o})=>`<tr><td><b>${esc(t.salon)}</b><br><span class="small muted">${t.id} · ${t.partner?esc(PT(t.partner).name):'No partner'}</span></td><td>${esc(o[1])}</td><td class="small">${esc(o[2])}</td><td class="n">${inr(o[3])}</td><td class="small">${esc(t.owner)}<br>+91 ${t.ownerPhone}</td><td><span class="row" style="gap:4px">${telL(t.ownerPhone)}<button class="btn s" data-act="pitch" data-t="${t.id}" data-o="${esc(o[1])}">Log pitch</button></span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No opportunities.</td></tr>'}</tbody></table></div>`};

/* --- directory: owners & managers only (business contacts) --- */
VIEWS.directory=()=>{const q=(S.ui.tab.dq||'').toLowerCase();const ppl=S.tenants.flatMap(t=>[{t,name:t.owner,role:'Owner',ph:t.ownerPhone,email:t.email,br:'All branches'},...(t.mgrs||[]).map(m=>({t,name:m.name,role:'Manager',ph:m.phone,email:'',br:m.branch}))]).filter(p=>!q||(p.name+' '+p.t.salon+' '+p.t.city+' '+p.ph).toLowerCase().includes(q));
  return head('Directory','Owners and managers of every client salon — your business contacts.')+`<div class="note i" style="margin-bottom:14px">Salon staff records stay inside each salon's own HRMS and are used only to run that salon's HR. They are not listed here or used for recruitment.</div>
  <div class="card"><input type="search" placeholder="Search name, salon, city or mobile" value="${esc(S.ui.tab.dq||'')}" data-change="dq" style="max-width:340px;margin-bottom:10px"><table class="stack"><thead><tr><th>Person</th><th>Salon</th><th>Contact</th><th></th></tr></thead><tbody>${ppl.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="small muted">${p.role} · ${esc(p.br)}</span></td><td>${esc(p.t.salon)}<br><span class="small muted">${p.t.id} · ${esc(p.t.city)}</span></td><td class="small">+91 ${esc(p.ph)}${p.email?'<br>'+esc(p.email):''}</td><td><span class="row" style="gap:4px">${telL(p.ph)}${waL(p.ph)}${mailL(p.email)}</span></td></tr>`).join('')}</tbody></table></div>`};
CH.dq=el=>{S.ui.tab.dq=el.value;render()};

/* --- talent pool (consent-based) --- */
VIEWS.talent=()=>{const q=(S.ui.tab.tq2||'').toLowerCase(),rf=S.ui.tab.tr||'';const L=S.cands.filter(c=>(!rf||c.role===rf)&&(!q||(c.name+' '+c.city+' '+c.role).toLowerCase().includes(q)));
  return head('Talent pool','Candidates who chose to be considered for salon jobs through Salon HR.',`<button class="btn p" data-act="addC">Add candidate</button>`)+
  `<div class="note i" style="margin-bottom:14px">Everyone here gave consent: direct applicants, recruitment-drive candidates and former employees who opted in at exit. Each record shows when consent was given. Candidates can ask to be removed at any time.</div>
  <div class="card"><div class="row" style="margin-bottom:10px"><select data-change="tr" style="width:auto"><option value="">All roles</option>${[...new Set(S.cands.map(c=>c.role))].map(r=>`<option${r===rf?' selected':''}>${esc(r)}</option>`).join('')}</select><input type="search" placeholder="Search name, city or role" value="${esc(S.ui.tab.tq2||'')}" data-change="tq2" style="max-width:300px"></div>
  <table class="stack"><thead><tr><th>Candidate</th><th>Role</th><th>City</th><th class="n">Expects</th><th>Source & consent</th><th>Status</th><th></th></tr></thead><tbody>${L.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="small muted">${c.exp} yrs · notice ${esc(c.notice)}</span></td><td>${esc(c.role)}</td><td>${esc(c.city)}</td><td class="n">${inr(c.expect)}</td><td class="small">${esc(c.source)}<br><span class="muted">Consent ${fdate(c.consentAt)}</span></td><td>${chip(c.status,c.status==='Available'?'c-ok':c.status==='Placed'?'c-info':'c-warn')}</td><td><span class="row" style="gap:4px">${telL(c.mobile)}<button class="btn s bad" data-act="rmC" data-id="${c.id}">Remove</button></span></td></tr>`).join('')}</tbody></table></div>`};
CH.tr=el=>{S.ui.tab.tr=el.value;render()};CH.tq2=el=>{S.ui.tab.tq2=el.value;render()};
ACT.rmC=el=>{const c=S.cands.find(x=>x.id===el.dataset.id);S.cands=S.cands.filter(x=>x.id!==c.id);S.jobs.forEach(j=>j.shortlist=j.shortlist.filter(x=>x!==c.id));audit('Removed candidate '+c.name+' from talent pool');render()};
ACT.addC=()=>openModal(`<h2>Add candidate</h2><form id="fc" class="fg"><label class="f">Name *<input name="n"></label><label class="f">Mobile *<input name="m" inputmode="tel"></label><label class="f">Role *<input name="r" list="dlR"></label><datalist id="dlR">${DESIGNATIONS.map(d=>`<option value="${esc(d)}">`).join('')}</datalist><label class="f">Experience (years)<input type="number" name="x" value="1"></label><label class="f">City *<input name="c"></label><label class="f">Expected salary (₹)<input type="number" name="s"></label><label class="f">Notice<select name="nt"><option>Immediate</option><option>15 days</option><option>30 days</option></select></label><label class="f">Source<select name="src"><option>Applied via website</option><option>Recruitment drive</option><option>Academy referral (consented)</option><option>Walk-in</option></select></label>
  <label class="chk" style="grid-column:1/-1"><input type="checkbox" name="ok"> The candidate has agreed to be contacted about salon jobs and to have their details shared with hiring salons.</label><div><button class="btn p">Add to pool</button></div></form>`,()=>{$('#fc').onsubmit=ev=>{ev.preventDefault();const f=$('#fc');if(!fv(f,'ok'))return toast('Candidate consent is required');if(!fv(f,'n')||!fv(f,'m')||!fv(f,'r')||!fv(f,'c'))return toast('Name, mobile, role and city are required');
  S.cands.unshift({id:'C'+(301+S.cands.length),name:fv(f,'n'),mobile:fv(f,'m').replace(/\D/g,'').slice(-10),role:fv(f,'r'),exp:+fv(f,'x')||0,city:fv(f,'c'),state:'',expect:+fv(f,'s')||0,notice:fv(f,'nt'),source:fv(f,'src'),consentAt:new Date().toISOString(),status:'Available',history:[]});audit('Added candidate '+fv(f,'n'));closeModal();render()}});
const DESIGNATIONS=['Helper','Gents Hair Dresser (GHD)','Sr. Gents Hair Dresser (Sr. GHD)','Unisex Hair Dresser (UHD)','Sr. Unisex Hair Dresser (Sr. UHD)','Hair Colourist','Beautician','Sr. Beautician','Nail Artist','Makeup Artist','Spa Therapist','Receptionist / Front Desk','Salon Floor Manager','Asst. Salon Manager','Salon Manager'];

/* --- job openings (for salons that use Recruitment & Sourcing) --- */
VIEWS.jobs=()=>{const js=S.jobs.filter(j=>myT().some(t=>t.id===j.tenant));
  return head('Job openings','Open positions from salons using Recruitment & Sourcing. Shortlist from the talent pool and share profiles with the salon.',`<button class="btn p" data-act="addJ">Add opening</button>`)+
  js.map(j=>{const t=T(j.tenant);const match=S.cands.filter(c=>c.status==='Available'&&c.role===j.role&&c.city===j.city&&!j.shortlist.includes(c.id));const sl=j.shortlist.map(id=>S.cands.find(c=>c.id===id)).filter(Boolean);
   return`<div class="card"><div class="row"><div class="sp"><h2 style="font-size:19px">${esc(j.role)} × ${j.count}</h2><div class="sub">${esc(t.salon)} · ${esc(j.city)} · ${inr(j.min)}–${inr(j.max)} · ${j.id} · opened ${fdate(j.at)}</div></div>${chip(j.status,j.status==='Open'?'c-warn':'c-ok')}</div>
   <h3 style="margin-top:12px">Shortlist (${sl.length})</h3>${sl.length?`<table class="stack"><tbody>${sl.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="small muted">${c.exp} yrs · ${inr(c.expect)} · notice ${esc(c.notice)}</span></td><td>${chip(c.status)}</td><td><span class="row" style="gap:4px">${telL(c.mobile)}${c.status!=='Placed'?`<button class="btn s ok" data-act="place" data-j="${j.id}" data-c="${c.id}">Mark placed</button>`:''}</span></td></tr>`).join('')}</tbody></table>`:'<p class="small muted">No one shortlisted yet.</p>'}
   <h3 style="margin-top:12px">Matching candidates in the pool (${match.length})</h3>${match.length?`<div class="list">${match.map(c=>`<div><span class="sp"><b>${esc(c.name)}</b> · ${c.exp} yrs · expects ${inr(c.expect)}<br><span class="small muted">${esc(c.source)}</span></span><button class="btn s" data-act="short" data-j="${j.id}" data-c="${c.id}">Shortlist</button></div>`).join('')}</div>`:'<p class="small muted">No available candidates match this role and city yet.</p>'}</div>`}).join('')||'<div class="card"><div class="empty">No open positions.</div></div>'};
ACT.short=el=>{const j=S.jobs.find(x=>x.id===el.dataset.j),c=S.cands.find(x=>x.id===el.dataset.c);j.shortlist.push(c.id);c.status='Interviewing';audit(`Shortlisted ${c.name} for ${T(j.tenant).salon} (${j.role})`);render()};
ACT.place=el=>{const j=S.jobs.find(x=>x.id===el.dataset.j),c=S.cands.find(x=>x.id===el.dataset.c);c.status='Placed';j.placed=(j.placed||0)+1;if(j.placed>=j.count)j.status='Filled';audit(`Placed ${c.name} at ${T(j.tenant).salon} — recruitment fee to invoice`);render();toast('Placed — add the recruitment fee to the salon\'s next invoice')};
ACT.addJ=()=>openModal(`<h2>Add job opening</h2><form id="fj" class="fg"><label class="f">Salon<select name="t">${myT().filter(t=>t.status==='Active').map(t=>`<option value="${t.id}">${esc(t.salon)}</option>`).join('')}</select></label><label class="f">Role<select name="r">${DESIGNATIONS.map(d=>`<option>${esc(d)}</option>`).join('')}</select></label><label class="f">Positions<input type="number" name="n" value="1" min="1"></label><label class="f">City<input name="c"></label><label class="f">Salary from (₹)<input type="number" name="a"></label><label class="f">Salary to (₹)<input type="number" name="b"></label><div><button class="btn p">Add</button></div></form>`,()=>{$('#fj').onsubmit=ev=>{ev.preventDefault();const f=$('#fj'),t=T(fv(f,'t'));S.jobs.unshift({id:'J-'+(501+S.jobs.length),tenant:t.id,role:fv(f,'r'),count:+fv(f,'n')||1,city:fv(f,'c')||t.city,min:+fv(f,'a')||0,max:+fv(f,'b')||0,status:'Open',shortlist:[],at:todayS});audit('Added opening for '+t.salon);closeModal();render()}});

/* --- announcements --- */

/* --- partners: performance --- */
const _par=VIEWS.partners;VIEWS.partners=()=>{const mStart=curMK+'-01';return _par()+`<div class="card"><h2>Partner performance · ${mname(curMK)}</h2><table class="stack"><thead><tr><th>Partner</th><th class="n">Calls logged</th><th class="n">Upsell pitches</th><th class="n">Requests resolved</th><th class="n">Compliance tasks done</th><th class="n">Avg salon health</th></tr></thead><tbody>${S.partners.map(p=>{const ts=S.tenants.filter(t=>t.partner===p.id),cs=S.calls.filter(c=>c.by===p.name&&c.at>=mStart);const h=ts.length?Math.round(ts.reduce((a,t)=>a+health(t)[0],0)/ts.length):0;
