<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon HR — HR partner for salons</title>
<meta name="description" content="Salon HR is the end-to-end HR partner for salons in India: recruitment, onboarding, attendance, payroll, PF/ESI compliance, performance and exit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: confident, warm, expert partner for salon owners — premium salon, not corporate HR
   IDEA: a salon's appointment book meets an HR file — berry leather cover, brass details, blush pages
   PICTURE: hero pairs the promise with a working enquiry form; lifecycle strip from sourcing to exit
   COLOUR+TYPE: lipstick berry dominant, blush support, brass accent; Outfit headings, Inter text
   LAYOUT: centred brand header, full-bleed bands alternating white / blush / berry, 1200px content */
:root{color-scheme:light dark;
--bg:light-dark(#fff,#140f12);--bg2:light-dark(#fbf1f5,#1d151a);--panel:light-dark(#fff,#21181d);--ink:light-dark(#22191d,#f4ecef);--mute:light-dark(#6c5f65,#b3a5ab);
--line:light-dark(#efe4e8,#362a31);--berry:light-dark(#8a1c4a,#e8709f);--deep:#4d1029;--brass:light-dark(#9a6d0c,#e2b650);--blush:light-dark(#f9e8ef,#3a2130);--ok:light-dark(#1b7246,#62d49c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,4.4vw,52px)}h2{font-size:clamp(26px,3vw,38px)}h3{font-size:19px}
p{margin:0}a{color:var(--berry)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(48px,7vw,96px) 0}
.eyebrow{color:var(--berry);font-weight:600;font-size:14px;margin-bottom:10px}
.lead{color:var(--mute);font-size:18px;max-width:640px;margin-top:12px}
/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;gap:12px}
.hnav{display:flex;gap:4px;align-items:center;justify-content:center}.mlogin{display:none!important}
.hnav>a,.hnav>div>button{background:none;border:0;color:var(--ink);text-decoration:none;font-weight:500;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:44px}
.hnav>a:hover,.hnav>div>button:hover{background:var(--bg2)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 26px Outfit,sans-serif;letter-spacing:-.3px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#e8709f,#8a1c4a 55%,#4d1029);display:grid;place-items:center;color:#fff;font:700 15px Outfit;font-style:normal}
.hright{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);min-height:46px;white-space:nowrap}
.btn.p{background:var(--berry);border-color:var(--berry);color:light-dark(#fff,#1b0f15)}
.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:var(--brass);border-color:var(--brass);color:light-dark(#fff,#1b130a)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.drop{position:relative}
.dpanel{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(760px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px #4d10292b;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.dpanel[hidden]{display:none}
.dpanel a{display:flex;gap:12px;padding:12px;border-radius:12px;text-decoration:none;color:var(--ink)}
.dpanel a:hover{background:var(--bg2)}
.dpanel a span.ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--blush);color:var(--berry);display:grid;place-items:center}
.dpanel b{display:block;font-size:15px}.dpanel small{color:var(--mute);font-size:13px;line-height:1.4;display:block}
.dpanel .all{grid-column:1/-1;justify-content:center;font-weight:600;color:var(--berry)}
.burger{display:none}.mob{display:none}
/* hero */
.hero{background:radial-gradient(1200px 500px at 0% 0%,var(--blush),transparent 60%),var(--bg)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,4vw,56px);align-items:start}
.usp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.usp div{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.usp .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--berry);color:#fff;display:grid;place-items:center}
.usp b{display:block;font-size:15px}.usp small{color:var(--mute);font-size:13.5px;line-height:1.45;display:block}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:13px;font-weight:500;background:var(--panel)}
.form{background:var(--deep);color:#fbeef3;border-radius:22px;padding:clamp(20px,3vw,30px);box-shadow:0 30px 70px #4d102940;position:relative;overflow:hidden}
.form:before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:28px solid #ffffff10}
.form h2{font-size:26px;color:#fff}.form p.s{opacity:.8;font-size:14px;margin:6px 0 16px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
label.f{display:block;font-size:13px;font-weight:500}
label.f>*{margin-top:5px}
.form input,.form select,.form textarea{width:100%;background:#ffffff14;border:1px solid #ffffff30;border-radius:10px;padding:10px 12px;color:#fff;font-size:16px;min-height:46px}
.form select option{color:#22191d}
.form textarea{min-height:76px}
.form input::placeholder,.form textarea::placeholder{color:#ffffff80}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff35;border-radius:30px;padding:6px 11px;font-size:13px;cursor:pointer}
.chips input{width:auto;min-height:0;accent-color:#e2b650}
.consent{display:flex;gap:8px;font-size:12.5px;opacity:.85;margin-top:12px;align-items:flex-start}.consent input{width:auto;min-height:0;margin-top:3px;accent-color:#e2b650}
.form .btn{width:100%;margin-top:14px}
.ok{background:#ffffff14;border-radius:14px;padding:18px}
/* challenge */
.chg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
.chg article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:12px}
.chg .pr{color:var(--mute);font-size:15px}
.chg .so{display:flex;gap:10px;background:var(--blush);border-radius:12px;padding:12px 14px;font-size:15px}
.chg .so b{color:var(--berry)}
.num{font:600 14px Outfit;color:var(--brass)}
/* lifecycle */
.life{background:var(--deep);color:#fbeef3}
.life .lead{color:#f3d9e4}
.track{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px;margin-top:38px;position:relative}
.track:before{content:"";position:absolute;left:4%;right:4%;top:27px;height:2px;background:linear-gradient(90deg,#e8709f,#e2b650)}
.track div{text-align:center;position:relative;font-size:13px;font-weight:500}
.track span{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:#2c0817;border:2px solid #e8709f;display:grid;place-items:center;color:#fff}
.crit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;margin-top:48px;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:20px;padding:clamp(20px,3vw,34px)}
.crit h3{font-size:26px;color:#fff}
.crit ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.crit li{display:flex;gap:10px}.crit li svg{flex:none;color:#e2b650;margin-top:3px}
/* expertise */
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:34px}
.exp div{border-top:3px solid var(--berry);background:var(--bg2);border-radius:0 0 16px 16px;padding:22px}
.exp h3{margin:10px 0 8px}.exp p{color:var(--mute);font-size:15px}
/* testimonials */
.tst{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;margin-top:30px;scrollbar-width:none}
.tst::-webkit-scrollbar{display:none}
.tst figure{flex:0 0 min(360px,84%);scroll-snap-align:start;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.stars{color:var(--brass);letter-spacing:2px;font-size:18px}
.tst blockquote{margin:0;font-size:16px;flex:1}
.tst figcaption b{display:block}.tst figcaption span{color:var(--mute);font-size:14px}
.sample{display:inline-block;background:var(--blush);color:var(--berry);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:600}
.ctrl{display:flex;gap:8px}
/* faq */
details.q{border-bottom:1px solid var(--line);padding:4px 0}
details.q summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font:600 18px Outfit,sans-serif}
details.q summary::-webkit-details-marker{display:none}
details.q summary:after{content:"+";color:var(--berry);font-size:24px;line-height:1}
details.q[open] summary:after{content:"–"}
details.q p{color:var(--mute);padding:0 0 18px;max-width:820px}
/* cta */
.cta{background:linear-gradient(120deg,var(--deep),#8a1c4a);color:#fff;border-radius:24px;padding:clamp(26px,4vw,48px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cta h2{color:#fff}
/* page hero */
.phero{background:var(--bg2);padding:clamp(40px,6vw,72px) 0}
.crumb{font-size:14px;color:var(--mute);margin-bottom:12px}.crumb a{color:var(--mute)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:30px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.box h3{margin-bottom:12px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px}.ticks svg{flex:none;color:var(--berry);margin-top:3px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.steps div{background:var(--bg2);border-radius:14px;padding:18px}.steps b{display:block;font:600 28px Outfit;color:var(--berry)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.sgrid a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .2s}
.sgrid a:hover{border-color:var(--berry)}
.sgrid .ic{width:46px;height:46px;border-radius:12px;background:var(--blush);color:var(--berry);display:grid;place-items:center;margin-bottom:14px}
.sgrid p{color:var(--mute);font-size:15px;margin-top:6px}
.more{display:inline-flex;gap:6px;align-items:center;color:var(--berry);font-weight:600;margin-top:12px;font-size:14px}
/* blog */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}
.bgrid a{text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bgrid a:hover{border-color:var(--berry)}
.cover{height:120px;background:linear-gradient(130deg,var(--deep),#8a1c4a 60%,#e8709f);position:relative;color:#fff;padding:16px;display:flex;align-items:flex-end;font:600 13px Inter}
.cover:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:18px solid #ffffff18}
.bgrid .in{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{color:var(--mute);font-size:13px}
.article{max-width:760px;margin:0 auto}
.article h2{font-size:24px;margin:30px 0 10px}
.article p,.article li{font-size:17px;line-height:1.75}
.article p{margin:12px 0}.article ul,.article ol{padding-left:22px}
.article .note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mute);margin-top:26px}
.legal{max-width:820px}.legal h2{font-size:22px;margin:26px 0 8px}.legal p{margin:8px 0;color:var(--ink)}
/* login & portal */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;max-width:980px;margin:0 auto}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}
.lcard.d{background:var(--deep);color:#fbeef3;border-color:var(--deep)}.lcard.d h2{color:#fff}
.lcard input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;margin-top:5px}
.lcard.d input{background:#ffffff14;border-color:#ffffff30;color:#fff}
.demo{display:grid;gap:6px;margin-top:14px}.demo button{text-align:left;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.lcard.d .demo button{border-color:#ffffff40;color:#fbeef3}
.svc-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.svc-row:last-child{border:0}
.svc-row .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--blush);color:var(--berry);display:grid;place-items:center}
.svc-row .t{flex:1}.svc-row small{color:var(--mute);display:block;font-size:13.5px}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--blush);color:var(--berry)}.tag.on{background:light-dark(#e2f3e9,#16301f);color:var(--ok)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:24px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}.kp div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.kp b{display:block;font:600 24px Outfit}.kp span{color:var(--mute);font-size:13px}
@media(max-width:860px){.lgrid,.pgrid{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* footer */
footer{background:#24070f;color:#e9d5dd;padding:56px 0 26px;margin-top:0}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr;gap:28px}
footer h4{font:600 15px Outfit;color:#fff;margin:0 0 12px}
footer a{color:#e9d5dd;text-decoration:none;font-size:14px;display:block;padding:4px 0}
footer a:hover{color:#fff}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a{width:42px;height:42px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;padding:0}
.fbot{border-top:1px solid #ffffff1c;margin-top:34px;padding-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:13px;color:#cdb5bf}
/* modal */
.modal{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:20px;padding:26px;width:min(460px,100%);position:relative}
.sheet .x{position:absolute;right:12px;top:12px}
.sheet input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;margin-top:5px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:70;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:980px){.mob{display:inline-flex}.hgrid,.crit,.cols{grid-template-columns:1fr}.track{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:22px}.track:before{display:none}.exp,.sgrid,.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}}
@media(max-width:1060px){.hright .btn span{display:none}.hright .btn{padding:10px 12px}}
@media(max-width:760px){.hbar{grid-template-columns:1fr auto}.hnav{display:none}.burger{display:inline-flex}.logo{font-size:22px}.hright .hl{display:none}.mlogin{display:flex!important}
 .hnav.open{display:flex;position:absolute;top:72px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 16px}
 .hnav.open .dpanel{position:static;transform:none;width:100%;box-shadow:none;grid-template-columns:1fr;padding:4px}
 .hright .btn span{display:none}.hright .btn{padding:10px 12px}}
@media(max-width:600px){.usp,.chg,.exp,.sgrid,.bgrid,.fg,.fgrid{grid-template-columns:1fr}.track{grid-template-columns:repeat(3,minmax(0,1fr))}.steps{grid-template-columns:1fr}.lead{font-size:16.5px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="btn x" data-act="close" aria-label="Close" style="min-height:36px;padding:6px 10px">✕</button><div id="mbody"></div></div></div>
<div id="toast" role="status"></div>
<script>
