<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalonHR Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, trustworthy back-office for salon owners and their staff; warm, never clinical
   IDEA: the salon's staff register and appointment ledger — ruled rows, clear status chips, signatures
   PICTURE: the working register / punch clock itself is the picture
   COLOUR+TYPE: lipstick berry dominant, blush support, brass accent; Outfit headings, Inter text
   LAYOUT: berry rail nav on the left, ledger content; under 860px the rail becomes a top scroller */
:root{color-scheme:light dark;
--bg:light-dark(#faf6f7,#141013);--panel:light-dark(#fff,#1e171b);--ink:light-dark(#22191d,#f4ecef);--mute:light-dark(#6e6267,#b3a5ab);
--line:light-dark(#ece3e6,#352a30);--berry:light-dark(#8a1c4a,#e8709f);--rail:#4d1029;--blush:light-dark(#f9e8ef,#3a2130);--brass:light-dark(#9a6d0c,#e2b650);
--ok:light-dark(#1b7246,#62d49c);--okb:light-dark(#e2f3e9,#16301f);--warn:light-dark(#975500,#f1b65c);--warnb:light-dark(#fcefd9,#382811);
--bad:light-dark(#b0271f,#ff8f86);--badb:light-dark(#fde5e3,#3c1917);--info:light-dark(#22549f,#8db6ff);--infob:light-dark(#e5edfa,#192540)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--berry)}
.wrap{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:#f6e6ee;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:700 21px Outfit,sans-serif;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,#e8709f,#9a6d0c);display:inline-block}
.brand small{display:block;font:500 11px Inter;opacity:.7}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:9px;cursor:pointer;min-height:40px}
.nav button:hover{background:#ffffff14}.nav button.on{background:#fff;color:#4d1029;font-weight:600}
.nav .badge{background:#e8709f;color:#fff;border-radius:20px;font-size:12px;padding:0 7px;line-height:20px}
.nav button.on .badge{background:var(--rail)}
.navsec{font-size:12px;opacity:.6;padding:14px 12px 4px}
main{padding:20px clamp(14px,3vw,36px) 60px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:600 clamp(22px,3vw,30px) Outfit,sans-serif}.kpi span{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--berry)}
.btn.p{background:var(--berry);border-color:var(--berry);color:light-dark(#fff,#1b0f15)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:light-dark(#fff,#0c1a12)}
.btn.bad{color:var(--bad);border-color:currentColor}
.btn.s{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px;font-size:16px;width:100%}
textarea{min-height:80px}
label.f{display:block;font-size:13px;color:var(--mute)}label.f>*{margin-top:4px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}label.chk input{width:auto;min-height:0;margin-top:3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blush)}
.scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--line)}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-info{background:var(--infob);color:var(--info)}.c-b{background:var(--blush);color:var(--berry)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--mute);font-weight:500}
.tabs button.on{border-color:var(--berry);color:var(--ink)}
.list>div{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mute)}
.muted{color:var(--mute)}.small{font-size:13px}.b{font-weight:600}
.empty{color:var(--mute);padding:20px;text-align:center}
.clock{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.face{background:var(--rail);color:#fff;border-radius:18px;padding:24px;position:relative;overflow:hidden}
.face .t{font:600 clamp(44px,8vw,68px) Outfit,sans-serif;letter-spacing:-1px}
.face .ring{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid #ffffff12}
.face .btn{border:0}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.tl li b{width:64px;font-variant-numeric:tabular-nums}
.mgrid td{padding:4px 2px;text-align:center;font-size:12px}.mgrid th{padding:4px 2px;text-align:center;font-size:11px}
.st{display:inline-block;min-width:26px;border-radius:5px;padding:2px 3px;font-weight:600;font-size:11.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:16px;width:min(880px,100%);padding:22px;position:relative}
.x{position:absolute;right:12px;top:12px}
.doc{background:#fff;color:#1d1d1d;border:1px solid #ddd;border-radius:8px;padding:clamp(18px,4vw,40px);font:14.5px/1.6 Georgia,'Times New Roman',serif;max-height:62vh;overflow:auto}
.doc h2{font:700 18px Georgia,serif;text-align:center;margin:14px 0}
.doc table{font:13.5px Georgia,serif}.doc td,.doc th{border:1px solid #ccc;padding:5px 8px;color:#1d1d1d}
.doc .lh{border-bottom:2px solid #8a1c4a;padding-bottom:8px;margin-bottom:12px;display:flex;flex-direction:column}
.doc .lh b{font-size:19px;color:#8a1c4a}.doc .lh span{font-size:12px;color:#555}
.doc ol{padding-left:20px}.doc li{margin-bottom:6px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
.sigs div{border-top:1px solid #999;padding-top:6px;font-size:12.5px;min-height:70px}
.sigs img{max-height:50px;display:block}
.sigs .typed{font:italic 24px 'Brush Script MT',cursive;color:#173a8a}
canvas.pad{width:100%;height:150px;border:1px dashed var(--mute);border-radius:10px;background:#fff;touch-action:none}
.bars .r{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bars .t{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.bars .t i{position:absolute;left:0;top:0;bottom:0;background:var(--berry);border-radius:6px}
.bars .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.fig{position:relative;height:230px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.note{background:var(--warnb);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.i{background:var(--infob)}
pre{white-space:pre;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.rail{position:sticky;top:0;height:auto;z-index:20;padding:8px}
.brand{padding:4px 6px 8px;font-size:17px}.brand small,.navsec{display:none}
.nav{display:flex;overflow-x:auto;gap:4px}.nav button{width:auto;flex:none;white-space:nowrap;gap:6px;min-height:36px;padding:7px 10px}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.clock{grid-template-columns:1fr}}
@media(max-width:600px){.row>.sp:not(:empty){flex-basis:100%}h1{font-size:24px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.sigs{grid-template-columns:1fr}.bars .r{grid-template-columns:90px minmax(0,1fr) 56px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.eapp{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:90px;background:var(--bg)}
.ehead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--rail);color:#f6e6ee;position:sticky;top:0;z-index:20}
.ehead .brand{font-size:18px}.eav{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-weight:600;cursor:pointer}
.emain{padding:16px}.eapp h1{font-size:24px}
.ebar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30}
.ebar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mute);padding:6px 0;min-height:54px;position:relative;cursor:pointer}
.ebar button.on{color:var(--berry);font-weight:600}.ebar svg{width:22px;height:22px}
.ebar b{position:absolute;top:3px;left:calc(50% + 6px);background:var(--berry);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
.elogin{max-width:440px;margin:0 auto;padding:40px 16px}
.eapp .clock,.eapp .g2,.eapp .g3{grid-template-columns:1fr}.eapp .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.eapp .stack thead{display:none}.eapp .stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.eapp .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.eapp .stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12px}.eapp .stack td:empty{display:none}
.eapp .sigs{grid-template-columns:1fr}body.emp #toast{bottom:92px}.emain>.row:first-child{display:grid;gap:10px}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body class="emp">
<script>window.EMP_MODE=true</script>
<div id="app"></div>
<div id="modal" class="modal" hidden><div class="sheet"><button class="btn s x" data-act="closeModal" aria-label="Close">Close</button><div id="mbody"></div></div></div>
<div id="toast" role="status"></div>
<script>
